  $("#rRef").addEventListener("click", () => renderReview(p));
  let data; try { [data] = await Promise.all([tapi("t_list"), loadTSettings(), ensureQuestions(true)]); } catch(e){ $("#rBody").innerHTML = `<div class="card"><p style="color:var(--bad)">${esc(e.message)}</p></div>`; return; }
  const F = S.teacher, all = data.items, st = data.stats;
  const students = {}; all.forEach(x => { const s = students[x.studentId] = students[x.studentId] || {id:x.studentId, name:x.studentName, n:0, rev:0, auto:[], last:""}; s.n++; if (x.status === "Reviewed") s.rev++; if (x.autoMax) s.auto.push(x.autoTotal/x.autoMax); if (x.submittedAt > s.last) s.last = x.submittedAt; });
  const list = all.filter(x => (!F.filterStudent || x.studentId === F.filterStudent) && (!F.filterTask || x.type === F.filterTask) && (F.filterStatus === "all" || (F.filterStatus === "todo" ? x.status !== "Reviewed" : x.status === "Reviewed")));
  $("#rBody").innerHTML = `<div class="stat" style="margin-block-end:18px"><div><span class="small muted">Waiting for review</span><b style="color:var(--ai)">${st.pending}</b></div><div><span class="small muted">Reviewed</span><b>${st.reviewed}</b></div><div><span class="small muted">Active students</span><b>${st.students}</b></div></div>
    <div class="card"><h2>Students</h2>${Object.keys(students).length ? `<table class="t"><thead><tr><th>Student</th><th>Submitted</th><th>Waiting</th><th>Avg auto-score</th><th>Last submission</th><th></th></tr></thead><tbody>${Object.values(students).map(s => `<tr>
      <td><b>${esc(s.name)}</b> <span class="small muted">${esc(s.id)}</span></td><td>${s.n}</td><td>${s.n-s.rev ? `<span class="badge b-warn">${s.n-s.rev}</span>` : '<span class="badge b-ok">0</span>'}</td>
      <td>${s.auto.length?Math.round(s.auto.reduce((x,y)=>x+y,0)/s.auto.length*100)+"%":"–"}</td><td class="small">${esc(fmtDate(s.last))}</td>
      <td><button class="btn ghost sm" type="button" data-show="${esc(s.id)}">Show work</button></td></tr>`).join("")}</tbody></table>` : `<p class="muted">No submissions yet. When students click <b>Submit for teacher feedback</b>, their work shows up here.</p>`}</div>
    <div class="card" style="margin-block-start:18px"><div class="row"><h2 style="margin:0">Submissions</h2><span class="spacer"></span>
      <select id="fS" style="inline-size:auto"><option value="">All students</option>${Object.values(students).map(s=>`<option value="${esc(s.id)}" ${F.filterStudent===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
      <select id="fT" style="inline-size:auto"><option value="">All question types</option>${TASKS.map(t=>`<option value="${t.id}" ${F.filterTask===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
      <select id="fR" style="inline-size:auto">${[["todo","Waiting for review"],["done","Reviewed"],["all","All"]].map(([v,l])=>`<option value="${v}" ${F.filterStatus===v?"selected":""}>${l}</option>`).join("")}</select></div>
      <div id="rlist">${list.length ? "" : `<p class="muted">Nothing to show for this filter.</p>`}</div></div>`;
  const rl = $("#rlist");
  list.slice(0, 80).forEach(x => { const it = getItem(x.type, x.itemIdx) || {}; const card = document.createElement("div"); card.className = "review-card";
    let parts = []; try { parts = JSON.parse(x.autoDetail || "[]"); } catch(e){}
    let key = ""; if (it.model) key = `<details class="small" style="margin-block-start:6px"><summary>Sample answer</summary><div style="white-space:pre-wrap">${esc(it.model)}</div></details>`; else if (x.type==="asq" && it.a) key = `<div class="small muted">Expected: ${esc(it.a[0])}</div>`;
    const reviewed = x.status === "Reviewed";
    card.innerHTML = `<div class="row"><b>${esc(x.taskName)}</b><span class="small muted">${esc(x.section||"")} · ${esc(qLabel(x.type, x.itemIdx))}</span><span class="spacer"></span><span class="small"><b>${esc(x.studentName)}</b> · ${esc(fmtDate(x.submittedAt))}</span><span class="badge ${reviewed?"b-ok":"b-warn"} stBadge">${reviewed?"Reviewed":"Waiting"}</span></div>
      <details class="small" style="margin-block:6px"><summary>Question</summary><div style="white-space:pre-wrap">${esc(x.prompt)}</div></details>
      ${x.hasAudio ? `<div style="margin-block:6px"><button class="btn ghost sm aBtn" type="button">▶ Play recording</button></div>` : ""}
      <div class="resp">${esc(x.response||"—")}</div>${key}
      <div class="small" style="margin-block-start:6px">Auto-score: <b>${x.autoMax?`${esc(x.autoTotal)} / ${esc(x.autoMax)}`:"not available"}</b> ${parts.length?"("+parts.map(q=>esc(q.label)+" "+esc(q.got)+"/"+esc(q.max)).join(", ")+")":""}</div>
      <div class="row" style="margin-block-start:10px;align-items:flex-start"><div style="inline-size:150px"><label class="f">Your score${x.autoMax?" (out of "+esc(x.autoMax)+")":""}</label><input type="text" class="rScore" value="${esc(x.teacherScore||"")}" placeholder="${x.autoMax?"e.g. "+esc(x.autoMax):"e.g. 8/10"}"></div>
        <div style="flex:1;min-inline-size:240px"><label class="f">Feedback for the student</label><textarea class="rCom" style="min-block-size:80px" placeholder="What went well, what to improve, one specific tip…">${esc(x.teacherFeedback||"")}</textarea></div></div>
      <div class="vrHost" style="margin-block-start:8px"></div>
      <div class="fbVoice small" style="margin-block-start:6px">${x.hasFeedbackAudio?`Your voice message: <button class="btn ghost sm fvPlay" type="button">▶ Play</button> <button class="btn ghost sm fvDel" type="button">Remove</button>`:""}</div>
      <div class="row" style="margin-block-start:8px"><button class="btn sm rSave" type="button">${reviewed?"Update feedback":"Send feedback"}</button>
        <span class="waSlot">${reviewed && x.studentPhone ? waBtn("data-wan", x.id, "Tell student on WhatsApp") : ""}</span><span class="small muted rInfo">${reviewed?"Sent "+esc(fmtDate(x.reviewedAt)):""}</span></div>`;
    const ab = card.querySelector(".aBtn"); if (ab) ab.addEventListener("click", async () => { ab.disabled = true; ab.textContent = "Loading…";
      try { const r = await tapi("t_audio", {id:x.id}); const au = document.createElement("audio"); au.controls = true; au.src = r.audio; ab.replaceWith(au); au.play().catch(()=>{}); } catch(e){ toast(e.message); ab.disabled = false; ab.textContent = "▶ Play recording"; } });
    let voice = null, removeVoice = false; const vrs = [makeRecorder(card.querySelector(".vrHost"), b => voice = b)];
    const prevActive = ACTIVE; ACTIVE = { cancel(){ vrs.forEach(v => v.cancel()); if (prevActive && prevActive.cancel) prevActive.cancel(); } };
    const bindVoice = () => { const pl = card.querySelector(".fvPlay"), dl = card.querySelector(".fvDel");
      if (pl) pl.addEventListener("click", async () => { pl.disabled = true; pl.textContent = "Loading…"; try { const r = await tapi("t_audio", {id:x.id, kind:"feedback"}); const au = document.createElement("audio"); au.controls = true; au.src = r.audio; pl.replaceWith(au); au.play().catch(()=>{}); } catch(e){ toast(e.message); pl.disabled = false; pl.textContent = "▶ Play"; } });
      if (dl) dl.addEventListener("click", () => { removeVoice = true; card.querySelector(".fbVoice").innerHTML = '<span class="muted">The voice message will be removed when you click Update feedback.</span>'; }); };
    bindVoice();
    const bindWa = () => { const w = card.querySelector("[data-wan]"); if (w) w.addEventListener("click", () => waOpen(x.studentPhone, feedbackWaText(x))); }; bindWa();
    card.querySelector(".rSave").addEventListener("click", async e => { const b = e.target; b.disabled = true; b.textContent = voice ? "Uploading voice…" : "Sending…";
      try { const audio = voice ? await blobToDataURL(voice) : null;
        const r = await tapi("t_feedback", {id:x.id, score:card.querySelector(".rScore").value.trim(), comment:card.querySelector(".rCom").value.trim(), audio, removeAudio: removeVoice && !voice});
        x.status = "Reviewed"; x.reviewedAt = r.reviewedAt; x.hasFeedbackAudio = r.hasFeedbackAudio; voice = null; removeVoice = false;
        vrs.push(makeRecorder(card.querySelector(".vrHost"), bb => voice = bb));
        card.querySelector(".fbVoice").innerHTML = x.hasFeedbackAudio ? `Your voice message: <button class="btn ghost sm fvPlay" type="button">▶ Play</button> <button class="btn ghost sm fvDel" type="button">Remove</button>` : ""; bindVoice();
        if (x.studentPhone) { card.querySelector(".waSlot").innerHTML = waBtn("data-wan", x.id, "Tell student on WhatsApp"); bindWa(); } x.teacherScore = card.querySelector(".rScore").value.trim(); x.teacherFeedback = card.querySelector(".rCom").value.trim();
        card.querySelector(".stBadge").className = "badge b-ok stBadge"; card.querySelector(".stBadge").textContent = "Reviewed"; card.querySelector(".rInfo").textContent = "Sent just now"; b.textContent = "Update feedback"; b.disabled = false; toast("Feedback sent to " + x.studentName + "."); }
      catch(err){ toast(err.message, 5000); b.disabled = false; b.textContent = reviewed ? "Update feedback" : "Send feedback"; } });
    rl.appendChild(card); });
  if (list.length > 80) rl.insertAdjacentHTML("beforeend", `<p class="small muted">Showing 80 of ${list.length}. Use the filters to narrow the list.</p>`);
  $("#fS").addEventListener("change", e => { F.filterStudent = e.target.value; renderReview(p); });
  $("#fT").addEventListener("change", e => { F.filterTask = e.target.value; renderReview(p); });
  $("#fR").addEventListener("change", e => { F.filterStatus = e.target.value; renderReview(p); });
  $$("[data-show]", p).forEach(b => b.addEventListener("click", () => { F.filterStudent = b.dataset.show; F.filterStatus = "all"; renderReview(p); }));
}

/* ---------- Students & access codes ---------- */
async function renderCodes(p){
  await loadTSettings();
  const def = new Date(Date.now() + 90*864e5).toISOString().slice(0,10);
  p.innerHTML = `<div class="grid g2"><div class="card"><h2>Create a student access code</h2>
      <label class="f" for="cName">Student name</label><input type="text" id="cName" placeholder="e.g. Lina Haddad">
      <label class="f" for="cPhone">WhatsApp number (optional)</label><input type="text" id="cPhone" inputmode="tel" placeholder="e.g. +962 79 123 4567 or 079 123 4567">
      <label class="f" for="cEmail">Email or note (optional)</label><input type="text" id="cEmail" placeholder="e.g. lina@example.com · Evening group">
      <label class="f" for="cExp">Access expires on</label><input type="date" id="cExp" value="${def}">
      <div class="row" style="margin-block-start:14px"><button class="btn" type="button" id="cGen">Create code</button><button class="btn ghost" type="button" id="cBulk">Create for a whole class…</button></div>
      <div id="cOut"></div></div>
    <div class="card"><h2>How access works</h2><ol class="steps small">
      <li>Each student gets a personal code like <span class="kbd">PTE-AB12-CD34-EF56</span>. Codes are checked online every time a student signs in.</li>
      <li>Send each student the <b>invite message</b>. The link signs them in with one click.</li>
      <li><b>Withdraw</b> stops a code immediately. <b>Extend</b> changes the expiry date. No changes to GitHub are needed.</li>
      <li>Add a WhatsApp number to send the invite from <b>WhatsApp Desktop</b> with the 💬 button. ${TSET.groupLink?"Your class group link is included in the message.":"Add your class group link under <b>Setup</b> to include it."}</li>
      <li>Everything is also visible in your Google Sheet (tabs <i>Students</i> and <i>Submissions</i>).</li></ol></div></div>
    <div class="card" style="margin-block-start:18px" id="cList"><p class="muted">Loading students…</p></div>`;
  const showCreated = list => { if (list.length === 1) { const c = list[0];
      $("#cOut").innerHTML = `<div class="score"><b>Code created for ${esc(c.name)}:</b> <span class="kbd" style="font-size:14px">${esc(c.code)}</span><div class="small muted">Valid until ${esc(c.expires)}</div>
        <div class="row" style="margin-block-start:8px"><button class="btn sm" type="button" id="cpM">Copy invite message</button><button class="btn ghost sm" type="button" id="cpL">Copy link only</button></div></div>`;
      if (c.phone) { $("#cOut .row").insertAdjacentHTML("afterbegin", `<button class="btn sm" type="button" id="cpW">💬 Send invite on WhatsApp</button>`); $("#cpW").addEventListener("click", () => waOpen(c.phone, studentMessage(c))); }
      $("#cpM").addEventListener("click", () => copyText(studentMessage(c))); $("#cpL").addEventListener("click", () => copyText(inviteLink(c.code))); }
    else { $("#cOut").innerHTML = `<div class="score"><b>${list.length} codes created.</b> <button class="btn sm" type="button" id="cpAll">Copy all invite links</button></div>`;
      $("#cpAll").addEventListener("click", () => copyText(list.map(c => `${c.name}: ${inviteLink(c.code)}`).join("\n"))); } };
  const create = async (students, btn) => { btn.disabled = true; const old = btn.textContent; btn.textContent = "Creating…";
    try { const r = await tapi("t_createCodes", {students}); r.created.forEach(c => { if (!c.expires || typeof c.expires !== "string" || c.expires.length > 10) c.expires = students[0].expires; c.phone = c.phone ? String(c.phone) : ""; }); showCreated(r.created); $("#cName").value = ""; $("#cEmail").value = ""; $("#cPhone").value = ""; loadList(); }
    catch(e){ toast(e.message, 5000); } btn.disabled = false; btn.textContent = old; };
  $("#cGen").addEventListener("click", e => { const name = $("#cName").value.trim(), expires = $("#cExp").value; if (!name) return toast("Enter the student's name."); if (!expires) return toast("Choose an expiry date."); create([{name, email:$("#cEmail").value.trim(), phone:$("#cPhone").value.trim(), expires}], e.target); });
  $("#cBulk").addEventListener("click", e => { const raw = prompt("One student per line: name, WhatsApp number (number optional). You can paste two columns from Excel.\nExample:\nLina Haddad, 0791234567\nOmar Saleh, +962 78 765 4321"); if (!raw) return; const expires = $("#cExp").value;
    const list = raw.split(/\n+/).map(l => l.split(/[,\t;]/).map(x => x.trim())).filter(x => x[0]).map(([name, phone]) => ({name, phone: phone||"", email:"", expires})); if (list.length) create(list, e.target); });
  let students = [];
  async function loadList(){ const box = $("#cList"); if (!box) return;
    try { students = (await tapi("t_codes")).students; } catch(e){ box.innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; return; }
    box.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Students (${students.length})</h2><button class="btn ghost sm" type="button" id="cCsv" ${students.length?"":"disabled"}>Export list (CSV)</button></div>
      ${students.length ? `<table class="t" style="margin-block-start:10px"><thead><tr><th>Student</th><th>Code</th><th>Expires</th><th>Status</th><th>Submissions</th><th>Last sign-in</th><th>Actions</th></tr></thead><tbody>${students.map(c => `<tr>
        <td><b>${esc(c.name)}</b><br><span class="small muted">${esc(fmtPhone(c.phone))}${c.phone&&c.email?" · ":""}${esc(c.email||"")}</span></td><td class="small"><span class="kbd">${esc(c.code)}</span></td><td class="small">${esc(c.expires)}</td>
        <td><span class="badge ${c.status==="Active"?"b-ok":c.status==="Expired"?"b-warn":"b-bad"}">${esc(c.status)}</span></td><td>${c.submissions}</td><td class="small">${c.lastLogin?esc(fmtDate(c.lastLogin)):'<span class="muted">Never</span>'}</td>
        <td><div class="row">${c.phone ? waBtn("data-wa", c.code) : `<button class="btn ghost sm" type="button" data-ph="${esc(c.code)}">+ WhatsApp no.</button>`}<button class="btn ghost sm" type="button" data-msg="${esc(c.code)}">Copy invite</button><button class="btn ghost sm" type="button" data-ext="${esc(c.code)}">Extend</button>
          ${c.status==="Withdrawn" ? `<button class="btn ghost sm" type="button" data-act="${esc(c.code)}">Reactivate</button>` : `<button class="btn ghost sm" type="button" data-wd="${esc(c.code)}">Withdraw</button>`}</div></td></tr>`).join("")}</tbody></table>` : `<p class="muted">No students yet. Create the first code above.</p>`}`;
    const find = code => students.find(c => c.code === code);
    const upd = async (code, data, msg) => { try { await tapi("t_updateCode", {code, ...data}); toast(msg); loadList(); } catch(e){ toast(e.message, 5000); } };
    $$("[data-msg]", box).forEach(b => b.addEventListener("click", () => copyText(studentMessage(find(b.dataset.msg)))));
    $$("[data-wa]", box).forEach(b => b.addEventListener("click", () => { const c = find(b.dataset.wa); waOpen(c.phone, studentMessage(c)); }));
    $$("[data-ph]", box).forEach(b => b.addEventListener("click", () => { const c = find(b.dataset.ph); const v = prompt(`WhatsApp number for ${c.name} (with country code, e.g. +962 79 123 4567):`, ""); if (v) upd(c.code, {phone:v.trim()}, "WhatsApp number saved."); }));
    $$("[data-wd]", box).forEach(b => b.addEventListener("click", () => { if (confirm(`Withdraw access for ${find(b.dataset.wd).name}? They will be signed out immediately.`)) upd(b.dataset.wd, {status:"Withdrawn"}, "Access withdrawn."); }));
    $$("[data-act]", box).forEach(b => b.addEventListener("click", () => upd(b.dataset.act, {status:"Active"}, "Access reactivated.")));
    $$("[data-ext]", box).forEach(b => b.addEventListener("click", () => { const d = prompt("New expiry date (YYYY-MM-DD):", new Date(Date.now()+90*864e5).toISOString().slice(0,10)); if (d) upd(b.dataset.ext, {expires:d.trim()}, "Expiry date updated."); }));
    const csv = $("#cCsv"); if (csv) csv.addEventListener("click", () => {
    const rows = [["Name","WhatsApp","Email/note","Code","Expires","Status","Submissions","Invite link"]].concat(students.map(c => [c.name, fmtPhone(c.phone), c.email||"", c.code, c.expires, c.status, c.submissions, inviteLink(c.code)]));
      download("PTE-students.csv", rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n")); });
  }
  loadList();
}

/* ---------- Setup ---------- */
async function renderSettings(p){
  await loadTSettings();
  p.innerHTML = `<div class="grid g2"><div class="card"><h2>Connection</h2>
      <p class="small">Online storage: <span class="badge b-ok">Connected</span></p>
      <p class="small muted" style="word-break:break-all">${esc(CONFIG.apiUrl)}</p>
      <p class="small">All codes, submissions and feedback are stored in your Google Sheet. Voice recordings are saved in your Google Drive folder <i>PTE Core Practice Hub - Recordings</i>.</p>
      <h3 style="margin-block-start:16px">Change your teacher password</h3>
      <p class="small">In the Apps Script editor, change <span class="kbd">TEACHER_PASSWORD</span>, then choose <b>Deploy → Manage deployments → Edit → Version: New version → Deploy</b>. The Web app URL stays the same.</p></div>
    <div class="card"><h2>WhatsApp</h2>
      <p class="small">The 💬 buttons open WhatsApp with the message already written — you just press Send.</p>
      <label class="f" for="sGroup">Class WhatsApp group invite link (optional)</label><input type="text" id="sGroup" placeholder="https://chat.whatsapp.com/..." value="${esc(TSET.groupLink)}">
      <p class="small muted">In WhatsApp: open the group → tap the group name → <b>Invite via link</b> → <b>Copy link</b>. It's added to every invite message so students can join in one tap.</p>
      <label class="f" for="sCC">Default country code (used for numbers starting with 0)</label><input type="text" id="sCC" style="inline-size:120px" value="${esc(TSET.countryCode)}">
      <label class="f" for="sMode">Open messages in</label><select id="sMode" style="inline-size:auto"><option value="app" ${TSET.waMode!=="web"?"selected":""}>WhatsApp Desktop app</option><option value="web" ${TSET.waMode==="web"?"selected":""}>WhatsApp Web (browser)</option></select>
      <div class="row" style="margin-block-start:12px"><button class="btn sm" type="button" id="sSave">Save WhatsApp settings</button></div></div>
    <div class="card"><h2>Your links</h2><p class="small">Student site:<br><span class="kbd" style="word-break:break-all">${esc(siteBase())}</span></p>
      <p class="small">Teacher portal (bookmark it):<br><span class="kbd" style="word-break:break-all">${esc(siteBase())}#teacher</span></p>
      <p class="small muted">Create codes from the live GitHub address so invite links point to the published platform.</p></div></div>`;
  $("#sSave").addEventListener("click", async e => { const b = e.target; b.disabled = true;
    try { const r = await tapi("t_saveSettings", {groupLink:$("#sGroup").value.trim(), countryCode:$("#sCC").value.trim(), waMode:$("#sMode").value}); TSET = r.settings; toast("WhatsApp settings saved."); }
    catch(err){ toast(err.message, 5000); } b.disabled = false; });
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  document.title = CONFIG.platformName;
  S.mode = /^#teacher/i.test(location.hash) ? "teacher" : "student";
  if (S.mode === "teacher" && !S.teacher.pass) S.teacher.pass = sessionStorage.getItem("pte_tpass") || localStorage.getItem("pte_tpass") || null;
  if (S.mode === "student" && !S.session && !/code=/.test(location.hash)) { try { const s = JSON.parse(localStorage.getItem("pte_session") || "null"); if (s && s.code && s.id) S.session = s; } catch(e){} }
  render();
}
window.addEventListener("hashchange", () => { const m = /^#teacher/i.test(location.hash) ? "teacher" : "student"; if (m !== S.mode || /code=/.test(location.hash)) { if (/code=/.test(location.hash)) S.session = null; boot(); } });
boot();
</script>
</body>
