function enterExam(attemptId, mockId){
  const m = {attemptId, mockId, sid:S.session.id}; localStorage.setItem("pte_mock_active", JSON.stringify(m)); MX.resume = m; S.view = "exam"; render(); window.scrollTo(0,0);
}
function mxConfirm(html, yes="Yes", no="No"){
  return new Promise(res => { const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div style="line-height:1.6">${html}</div><div class="row" style="justify-content:flex-end;margin-block-start:16px"><button class="btn ghost" type="button" id="mcNo">${esc(no)}</button><button class="btn" type="button" id="mcYes">${esc(yes)}</button></div></div>`;
    document.body.appendChild(bg); const done = v => { bg.remove(); res(v); };
    bg.querySelector("#mcYes").addEventListener("click", () => done(true)); bg.querySelector("#mcNo").addEventListener("click", () => done(false)); bg.querySelector("#mcYes").focus(); });
}
const mxUnload = e => { e.preventDefault(); e.returnValue = ""; return ""; };
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function renderExam(app){
  document.body.classList.add("exam-on");
  app.innerHTML = `<div class="xm" id="xm"><div class="xm-top"><span class="xm-title" id="xmTitle">PTE Mock Test</span><span class="small" style="opacity:.8">${esc(S.session.n)}</span>
      <span class="xm-right"><span id="xmQ"></span><span class="xm-timer" id="xmT"></span></span></div><div class="xm-sub"></div>
    <div class="xm-body" id="xmB"><p>Loading your test…</p></div>
    <div class="xm-foot"><button class="xm-quit" id="xmQuit" type="button">Finish / Exit test</button><span class="xm-info" id="xmInfo"></span><button class="xm-next" id="xmNext" type="button" disabled>Next</button></div></div>`;
  const sess = {cancelled:false, stops:[], cancel(){ this.cancelled = true; this.stops.forEach(f => { try { f(); } catch(e){} }); window.removeEventListener("beforeunload", mxUnload); }};
  ACTIVE = sess;
  window.addEventListener("beforeunload", mxUnload);
  $("#xmQuit").addEventListener("click", () => mxQuit(sess));
  try { await mxRun(sess); }
  catch(e){ if (sess.cancelled) return; window.removeEventListener("beforeunload", mxUnload);
    $("#xmB").innerHTML = `<div class="xm-screen"><h2>Something went wrong</h2><p>${esc(e.message)}</p><p>Your answers so far are saved. Check your internet connection and try again.</p><button class="btn" type="button" id="xmRetry">Try again</button> <button class="btn ghost" type="button" id="xmLeave">Back to Mock Exam</button></div>`;
    $("#xmRetry").addEventListener("click", () => { MX.resume = JSON.parse(localStorage.getItem("pte_mock_active") || "null"); render(); });
    $("#xmLeave").addEventListener("click", () => { localStorage.removeItem("pte_mock_active"); go("mock"); }); }
}
/* One "screen": sets the body, enables Next, resolves when Next is pressed. */
function mxScreen(sess, html, opts={}){
  return new Promise(res => { $("#xmB").innerHTML = `<div class="xm-screen">${html}</div>`; $("#xmQ").textContent = opts.q || ""; $("#xmT").textContent = "";
    const nx = $("#xmNext"); nx.disabled = false; nx.onclick = () => { nx.onclick = null; res(true); }; if (opts.bind) opts.bind(); });
}
async function mxRun(sess){
  const st = MX.resume; MX.resume = null;
  if (!st || !st.attemptId) throw new Error("No mock test selected.");
  const r = MX.preload && MX.preload.attempt.id === st.attemptId ? MX.preload : await api("m_state", {code:S.session.code, attemptId:st.attemptId}); MX.preload = null;
  const a = r.attempt; MX.att = a; MX.offset = Date.parse(r.now) - Date.now(); MX.lastPart = 0; MX.resumeItem = null;
  $("#xmTitle").textContent = a.title;
  if (a.status !== "In progress") { localStorage.removeItem("pte_mock_active"); window.removeEventListener("beforeunload", mxUnload); return mxFinished(a, true); }
  setExam(a.exam); await ensureQuestions();
  const local = (await DB.all("mock")).filter(x => x.attemptId === a.id);
  MX.done = new Set(a.answered.concat(local.map(x => x.idx)));
  for (const x of local.filter(x => !x.sent && !a.answered.includes(x.idx))) { try { await mxSend(x); } catch(e){} }
  const partial = await DB.get("mockp", a.id);
  if (partial && !MX.done.has(partial.idx)) {
    const d = a.draw[partial.idx], t = mxTask(d.t, a.exam);
    if (t.kind === "speak" && partial.recStarted) { const blob = partial.chunks && partial.chunks.length ? new Blob(partial.chunks, {type: partial.mime || "audio/webm"}) : null;
      await mxSave(a, partial.idx, {kind:"speak", secs: partial.secs || 0, interrupted:true}, null, blob); }
    else MX.resumeItem = partial;
  }
  if (!MX.done.size && !localStorage.getItem("pte_mock_intro_" + a.id)) { await mxIntro(sess, a); localStorage.setItem("pte_mock_intro_" + a.id, "1"); if (sess.cancelled) return; }
  else if (MX.done.size) { await mxScreen(sess, `<h2>Welcome back</h2><p>Your test continues where you stopped. Answers you already gave are saved, and part timers have kept running.</p><p>Press <b>Next</b> to continue.</p>`); if (sess.cancelled) return; }
  if (!MX.stream || !MX.stream.active) { try { MX.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); } catch(e){ MX.stream = null; } }
  sess.stops.push(() => { if (MX.stream) { MX.stream.getTracks().forEach(x => x.stop()); MX.stream = null; } });
  for (let i = 0; i < a.draw.length; i++) {
    if (sess.cancelled) return;
    if (MX.done.has(i)) continue;
    const d = a.draw[i], g = groupOf(d);
    if (MX.lastPart !== d.p) { MX.lastPart = d.p; await mxPartIntro(sess, d.p, a); if (sess.cancelled) return; }
    if (g) { if (!a.partStart[g]) { const rr = await api("m_save", {code:S.session.code, attemptId:a.id, groupStart:g}); a.partStart = rr.partStart; }
      if (mxGroupLeft(a, g) <= 0) { await mxBlankGroup(a, g); continue; } }
    const res = await mxItem(sess, a, i, d);
    if (sess.cancelled) return;
    await mxSave(a, i, res.response, res.auto, res.audio);
    if (res.groupExpired) await mxBlankGroup(a, g);

    const get = () => $$("select.blank", box).map(s => s.value); return {get, empty: () => get().every(v => !v)}; }
  if (k === "mcm" || k === "mcs") { const multi = k === "mcm";
    box.innerHTML = (listening ? "" : `<div class="xm-text" style="margin-block-end:10px">${esc(item.text || "")}</div>`) + `<div style="font-weight:700;margin-block:10px">${esc(item.q || "")}</div>` +
      item.o.map((o, n) => `<label class="opt"><input type="${multi ? "checkbox" : "radio"}" name="xmc" value="${n}"><span>${esc(o)}</span></label>`).join("");
    const get = () => $$("input[name=xmc]:checked", box).map(x => +x.value); return {get, empty: () => !get().length}; }
  if (k === "ro") { let order = shuffle(item.items.map((_, n) => n), seed); if (order.every((v, n) => v === n)) order.reverse(); let touched = false;
    const draw = () => { box.innerHTML = `<div class="small" style="margin-block-end:6px">Use the arrows to put the paragraphs in the correct order.</div>` + order.map((kk, pos) => `<div class="ro-item"><span class="t">${esc(item.items[kk])}</span><button class="btn ghost sm" type="button" data-up="${pos}" ${pos===0?"disabled":""} aria-label="Move up">↑</button><button class="btn ghost sm" type="button" data-dn="${pos}" ${pos===order.length-1?"disabled":""} aria-label="Move down">↓</button></div>`).join("");
      $$("[data-up]", box).forEach(b => b.addEventListener("click", () => { const q = +b.dataset.up; [order[q-1], order[q]] = [order[q], order[q-1]]; touched = true; draw(); }));
      $$("[data-dn]", box).forEach(b => b.addEventListener("click", () => { const q = +b.dataset.dn; [order[q+1], order[q]] = [order[q], order[q+1]]; touched = true; draw(); })); };
    draw(); return {get: () => order.slice(), empty: () => !touched}; }
  if (k === "dnd") { const pool = shuffle(item.a.concat(item.extra || []), seed); const fill = {}; let selected = null;
    box.innerHTML = `<div class="xm-text">${esc(item.text).replace(/\[\[(\d+)\]\]/g, (_, n) => `<span class="drop" data-d="${n}" tabindex="0">&nbsp;</span>`)}</div><div class="chips" id="xmPool"></div>`;
    const drawPool = () => { const used = Object.values(fill); $("#xmPool", box).innerHTML = pool.filter(w => !used.includes(w)).map(w => `<span class="chip ${selected===w?"sel":""}" draggable="true" data-w="${esc(w)}">${esc(w)}</span>`).join("");
      $$(".chip", box).forEach(c => { c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.w)); c.addEventListener("click", () => { selected = selected === c.dataset.w ? null : c.dataset.w; drawPool(); }); }); };
    const drawDrops = () => $$(".drop", box).forEach(dd => { const w = fill[dd.dataset.d]; dd.textContent = w || "\u00a0"; dd.classList.toggle("filled", !!w); });
    const place = (dd, w) => { for (const kk in fill) if (fill[kk] === w) delete fill[kk]; fill[dd.dataset.d] = w; selected = null; drawDrops(); drawPool(); };
    $$(".drop", box).forEach(dd => { dd.addEventListener("dragover", e => e.preventDefault()); dd.addEventListener("drop", e => { e.preventDefault(); place(dd, e.dataTransfer.getData("text/plain")); });
      dd.addEventListener("click", () => { if (selected) place(dd, selected); else if (fill[dd.dataset.d]) { delete fill[dd.dataset.d]; drawDrops(); drawPool(); } }); });
    drawPool(); const get = () => item.a.map((_, n) => fill[n] || ""); return {get, empty: () => get().every(v => !v)}; }
  if (k === "lfib") { let n = 0; box.innerHTML = `<div class="xm-text">${esc(item.script).replace(/\[([^\]]+)\]/g, () => `<input class="blank" type="text" data-b="${n++}" spellcheck="false" autocomplete="off" aria-label="Blank ${n}">`)}</div>`;
    const get = () => $$("input.blank", box).map(x => x.value.trim()); return {get, empty: () => get().every(v => !v)}; }
  if (k === "hiw") { const shown = item.shown.split(/\s+/), sel = new Set();
    box.innerHTML = `<div class="xm-text hiw">${shown.map((w, n) => `<span data-i="${n}">${esc(w)}</span>`).join(" ")}</div>`;
    $$(".hiw span", box).forEach(s => s.addEventListener("click", () => { const n = +s.dataset.i; sel.has(n) ? sel.delete(n) : sel.add(n); s.classList.toggle("sel"); }));
    return {get: () => [...sel].sort((x, y) => x - y), empty: () => !sel.size}; }
  if (k === "wfd") { box.innerHTML = `<input type="text" id="xmWfd" spellcheck="false" autocomplete="off" style="margin-block-start:12px">`;
    return {get: () => $("#xmWfd", box).value, empty: () => !$("#xmWfd", box).value.trim()}; }
  box.innerHTML = `<p class="muted">This question type is not available.</p>`; return {get: () => null, empty: () => true};
}

/* ---------- Student: score report ---------- */
async function renderMockReport(app){
  app.innerHTML = `<div class="card"><p class="muted">Loading your score report…</p></div>`;
  let a; try { await ensureQuestions(); a = (await api("m_state", {code:S.session.code, attemptId:MX.report})).attempt; } catch(e){ app.innerHTML = `<div class="card"><p style="color:var(--bad)">${esc(e.message)}</p></div>`; return; }
  if (a.status !== "Reviewed" || !a.report) { app.innerHTML = `<div class="card"><h2>${esc(a.title)}</h2><p>Your teacher hasn't published the score report yet.</p><button class="btn ghost" type="button" data-nav="mock">← Back</button></div>`; return; }
  const r = a.report, sk = r.skills || {}, en = r.enabling || {}, ans = Object.fromEntries((a.answers || []).map(x => [x.idx, x]));
  const COL = {listening:"#2a9d8f", reading:"#e9c46a", speaking:"#5a67d8", writing:"#e76f51"};
  const bar = (label, v, col) => `<div class="sk"><span>${esc(label)}</span><b>${esc(v)}</b><div class="trk"><i style="inline-size:${clamp((Number(v) - 10) / 80 * 100, 0, 100)}%;background:${col}"></i><span class="ticks"><span>10</span><span>30</span><span>50</span><span>70</span><span>90</span></span></div></div>`;
  const comments = Object.entries(r.items || {}).map(([i, c]) => ({i:+i, c})).sort((x, y) => x.i - y.i);
  app.innerHTML = `<div class="row no-print" style="margin-block-end:12px"><button class="btn ghost sm" type="button" data-nav="mock">← Mock Exam</button><span class="spacer"></span><button class="btn ghost sm" type="button" onclick="window.print()">🖨 Print</button></div>
    <div class="rep" id="scoreReport"><div class="rep-head"><div class="rep-ov"><div><b id="repOverall">${esc(r.overall)}</b><small>OVERALL</small></div></div>
      <div><div style="font-size:12px;letter-spacing:.2em;color:var(--orange);font-weight:700">SCORE REPORT · MOCK TEST</div><h1 style="color:#fff;margin:4px 0">${esc(a.title)}</h1><div style="color:#dfe6f3">${esc(S.session.n)} · ${a.finished ? "taken " + esc(fmtDate(a.finished)) : ""}${a.reviewedBy ? " · reviewed by " + esc(a.reviewedBy) : ""}</div></div></div>
    <div class="card" style="border-radius:0 0 14px 14px"><h2>Communicative skills</h2>
      ${bar("Listening", sk.listening, COL.listening)}${bar("Reading", sk.reading, COL.reading)}${bar("Speaking", sk.speaking, COL.speaking)}${bar("Writing", sk.writing, COL.writing)}
      <div class="sk" style="margin-block-start:14px"><span><b>Overall</b></span><b>${esc(r.overall)}</b><div class="trk"><i style="inline-size:${clamp((r.overall - 10) / 80 * 100, 0, 100)}%;background:var(--navy)"></i></div></div>
      ${Object.keys(en).length ? `<h2 style="margin-block-start:26px">Enabling skills</h2>${ENABLING.filter(([k]) => en[k]).map(([k, l]) => bar(l, en[k], "#94a3b8")).join("")}` : ""}
      <p class="small muted" style="margin-block-start:18px">Scores are your teacher's assessment of this mock test on the 10–90 PTE scale. They are an estimate of your level, not an official Pearson result.</p></div>
    <div class="grid g2" style="margin-block-start:18px">
      ${r.strengths ? `<div class="card"><h2>✅ Strengths</h2><div style="white-space:pre-wrap">${esc(r.strengths)}</div></div>` : ""}
      ${r.improve ? `<div class="card"><h2>🎯 Areas to improve</h2><div style="white-space:pre-wrap">${esc(r.improve)}</div></div>` : ""}
      ${r.plan ? `<div class="card"><h2>🗓 Study plan / next steps</h2><div style="white-space:pre-wrap">${esc(r.plan)}</div></div>` : ""}
      ${a.hasFeedbackAudio ? `<div class="card"><h2>🔊 Voice message from your teacher</h2><button class="btn" type="button" id="repVoice">▶ Play voice feedback</button></div>` : ""}</div>
    <div class="card" style="margin-block-start:18px"><h2>Your answers${comments.length ? " &amp; comments" : ""}</h2>
      ${a.draw.map((d, i) => { const t = mxTask(d.t, a.exam), x = ans[i], c = (r.items || {})[i], item = mockItem(d, a.qdata);
        if (!c && !(x && x.hasAudio)) return "";
        return `<div class="review-card"><div class="row"><b>${esc(PART_NAMES[d.p].split(":")[0])} · ${esc(t.name)}</b><span class="spacer"></span>${x && x.hasAudio ? `<button class="btn ghost sm" type="button" data-myrec="${i}">▶ Replay my recording</button>` : ""}</div>
          ${t.kind !== "speak" ? mxResponseHTML(d.t, item, x, a.exam, false) : ""}${c ? `<div class="fb"><b>Teacher:</b> ${esc(c)}</div>` : ""}</div>`; }).join("")}
    </div></div>`;
  const v = $("#repVoice"); if (v) v.addEventListener("click", async () => { v.disabled = true; try { const rr = await api("m_audio", {code:S.session.code, attemptId:a.id, kind:"feedback"}); const au = document.createElement("audio"); au.controls = true; au.src = rr.audio; v.replaceWith(au); au.play().catch(()=>{}); } catch(e){ toast(e.message); v.disabled = false; } });
  $$("[data-myrec]", app).forEach(b => b.addEventListener("click", async () => { b.disabled = true; b.textContent = "Loading…";
    try { const rr = await api("m_audio", {code:S.session.code, attemptId:a.id, idx:+b.dataset.myrec}); const au = document.createElement("audio"); au.controls = true; au.src = rr.audio; b.replaceWith(au); au.play().catch(()=>{}); } catch(e){ toast(e.message); b.disabled = false; b.textContent = "▶ Replay my recording"; } }));
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  document.title = CONFIG.platformName;
  S.mode = /^#teacher/i.test(location.hash) ? "teacher" : "student";
  if (S.mode === "teacher" && !S.teacher.pass) { const raw = sessionStorage.getItem("pte_tpass") || localStorage.getItem("pte_tpass") || null;
    if (raw) { let c; try { c = JSON.parse(raw); } catch(e){ c = null; } if (c && typeof c === "object") { S.teacher.pass = c.pass; S.teacher.user = c.user || ""; } else { S.teacher.pass = raw; S.teacher.user = ""; } }
    if (S.teacher.pass) { $("#app").innerHTML = `<div class="card"><p class="muted">Signing in…</p></div>`; await loadTSettings(); render(); return; } }
  if (S.mode === "student" && !S.session && !/code=/.test(location.hash)) { try { const s = JSON.parse(localStorage.getItem("pte_session") || "null"); if (s && s.code && s.id) { S.session = s; setExam(s.exam || "Core"); } } catch(e){} }
  if (S.mode === "student" && S.session) { try { const m = JSON.parse(localStorage.getItem("pte_mock_active") || "null"); if (m && m.sid === S.session.id && m.attemptId) { S.view = "exam"; MX.resume = m; } } catch(e){} }
  render();
}
window.addEventListener("hashchange", () => { const m = /^#teacher/i.test(location.hash) ? "teacher" : "student"; if (m !== S.mode || /code=/.test(location.hash)) { if (/code=/.test(location.hash)) S.session = null; S.preview = null; if (m === "teacher") S.session = null; boot(); } });
boot();
</script>
