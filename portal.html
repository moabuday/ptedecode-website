<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logo.png">
<title>PTE Decode Academy · Student &amp; Teacher Portal</title>
<style>
:root{
  --bg:#F5F7FB; --card:#ffffff; --fg:#1f2430; --muted:#6b7280; --border:#e3e6ee;
  --navy:#0A1F44; --orange:#FF7A00;
  --brand:#0A1F44; --brand-2:#17377a; --brand-soft:#e9eef8;
  --ai:#e86a00; --ai-soft:#fff1e3; --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --radius:12px;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
header.top{position:sticky;inset-block-start:0;z-index:20;background:var(--navy);border-block-end:3px solid var(--orange);box-shadow:var(--shadow)}
.top-in{max-inline-size:1180px;margin-inline:auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.wm{display:inline-flex;flex-direction:column;line-height:1;font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
.wm b{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.01em}
.wm b span{color:var(--orange)}
.wm small{font-size:9.5px;letter-spacing:.42em;color:#dfe6f3;margin-block-start:3px;font-weight:500}
.logo-badge{inline-size:34px;block-size:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#5a67d8);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:#c9d3e6;font-weight:600}
nav.tabs button.on,nav.tabs button:hover{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 -2px 0 var(--orange)}
.spacer{flex:1}
.who{font-size:13px;color:#c9d3e6}
header.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
header.top .btn.ghost:hover{background:rgba(255,255,255,.12)}
main{max-inline-size:1180px;margin-inline:auto;padding:22px 18px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.accent:hover{background:#e56d00}
/* landing */
.landing{max-inline-size:1100px;margin-inline:auto}
.lhero{background:var(--navy);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;box-shadow:0 10px 30px rgba(10,31,68,.25)}
@media (max-width:860px){.lhero{grid-template-columns:1fr}}
.lhero img{inline-size:100%;display:block}
.lhero .lform{background:var(--card);margin:22px;border-radius:14px;padding:22px}
.lhero .lform h2{margin:0 0 4px}
.lfeat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-block:18px}
.lfeat div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;border-block-start:3px solid var(--orange)}
.lfeat b{display:block;margin-block-end:4px}
.social{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}
@media (max-width:860px){.social{grid-template-columns:1fr}}
.vid{position:relative;display:block;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,#17377a 60%,#24489a 100%);min-block-size:210px;text-decoration:none;color:#fff}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play span{inline-size:74px;block-size:74px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .15s}
.vid:hover .play span{transform:scale(1.08)}
.vid .cap{position:absolute;inset-inline:0;inset-block-end:0;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-weight:600}
.vid .tagl{position:absolute;inset-block-start:14px;inset-inline-start:16px;font-weight:800;font-size:18px}
.vid .tagl span{color:var(--orange)}
footer.site{margin-block-start:28px;padding-block:16px;border-block-start:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:var(--muted)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:9px 11px;inline-size:100%}
textarea{min-block-size:120px;resize:vertical;line-height:1.6}
label.f{display:block;font-weight:600;font-size:13px;margin-block:10px 4px}
/* section list (mirrors the reference menu) */
.sec-head{display:flex;align-items:center;justify-content:space-between;border-block-end:2px solid var(--border);padding-block-end:8px;margin-block-end:6px}
.sec-head h2{margin:0;position:relative}
.sec-head h2::after{content:"";position:absolute;inset-inline-start:0;inset-block-end:-10px;inline-size:100%;block-size:2px;background:var(--brand)}
.tag-ai{color:var(--ai);font-weight:700;font-size:12px;white-space:nowrap}
.tag-pill{background:var(--ai-soft);color:var(--ai);font-weight:700;font-size:11px;border-radius:6px;padding:2px 8px}
.task-link{display:flex;align-items:center;gap:8px;padding:9px 6px;border-radius:8px;cursor:pointer;background:none;border:0;inline-size:100%;text-align:start}
.task-link:hover{background:var(--brand-soft)}
.task-link .nm{font-size:15px}
.task-link .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-block-end:20px}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-inline-size:120px}
.stat b{display:block;font-size:22px}
/* practice */
.prac{display:grid;grid-template-columns:220px 1fr;gap:18px}
@media (max-width:820px){.prac{grid-template-columns:1fr}}
.qnav{display:flex;flex-direction:column;gap:6px}
.qnav button{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:8px 10px;text-align:start;cursor:pointer;display:flex;gap:8px;align-items:center}
.qnav button.on{border-color:var(--brand);background:var(--brand-soft)}
.qnav .done{margin-inline-start:auto;color:var(--ok);font-weight:700}
.instr{background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin-block-end:14px;font-size:14px}
.tip{border-inline-start:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:8px;font-size:14px;margin-block:12px}
.passage{font-size:16px;line-height:1.85;background:var(--bg);border-radius:10px;padding:14px 16px;border:1px solid var(--border)}
.rec{border:1px solid var(--border);border-radius:10px;padding:14px;margin-block-start:14px;max-inline-size:520px}
.rec-status{font-weight:600;margin-block-end:8px}
.bar{block-size:8px;background:var(--border);border-radius:99px;overflow:hidden}
.bar>i{display:block;block-size:100%;inline-size:0;background:var(--brand);transition:inline-size .2s linear}
.bar.recording>i{background:var(--ai)}
.rec-live{font-size:13px;color:var(--muted);margin-block-start:8px;min-block-size:1.2em;font-style:italic}
.score{margin-block-start:16px;border:1px solid var(--border);border-radius:10px;padding:14px}
.score .tot{font-size:26px;font-weight:800;color:var(--brand)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-block:10px}
.parts div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px}
.parts b{font-size:16px}
.model{background:var(--ok-soft);border-radius:8px;padding:10px 14px;margin-block-start:10px;font-size:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-block:6px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
select.blank{inline-size:auto;display:inline-block;padding:3px 6px;margin:0 2px}
input.blank{inline-size:130px;display:inline-block;padding:3px 6px;margin:0 2px}
.blank.right{border-color:var(--ok);background:var(--ok-soft)}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft)}
.drop{display:inline-block;min-inline-size:110px;border-block-end:2px dashed var(--brand);padding:1px 8px;margin:0 3px;text-align:center;cursor:pointer;border-radius:4px}
.drop.filled{background:var(--brand-soft);border-block-end-style:solid}
.drop.right{background:var(--ok-soft);border-color:var(--ok)}
.drop.wrong{background:var(--bad-soft);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px;padding:10px;border:1px dashed var(--border);border-radius:10px;min-block-size:50px}
.chip{background:var(--card);border:1px solid var(--brand);color:var(--brand-2);border-radius:8px;padding:5px 12px;cursor:grab;font-weight:600}
.chip.sel{background:var(--brand);color:#fff}
.ro-item{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px;margin-block:6px;background:var(--card)}
.ro-item .t{flex:1}
.ro-item.right{border-color:var(--ok)} .ro-item.wrong{border-color:var(--bad)}
.hiw span{cursor:pointer;border-radius:4px;padding:1px 2px}
.hiw span:hover{background:var(--brand-soft)}
.hiw span.sel{background:var(--warn-soft);outline:1px solid var(--warn)}
.hiw span.right{background:var(--ok-soft);outline:1px solid var(--ok)}
.hiw span.wrong{background:var(--bad-soft);outline:1px solid var(--bad)}
.hiw span.missed{text-decoration:underline wavy var(--bad)}
.wc{font-size:13px;color:var(--muted);margin-block-start:6px;display:flex;justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand)}
.timer.low{color:var(--ai)}
table.t{inline-size:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;border-block-end:1px solid var(--border);text-align:start;vertical-align:top}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--brand-soft);color:var(--brand-2)}
.login-wrap{min-block-size:80vh;display:grid;place-items:center}
.login{max-inline-size:460px;inline-size:100%}
.code-box{font-family:Consolas,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
.toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:var(--shadow);max-inline-size:90vw}
.review-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-block:12px;background:var(--card)}
.review-card .resp{background:var(--bg);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:14px}
.fb{background:var(--brand-soft);border-radius:8px;padding:10px 12px;margin-block-start:8px;font-size:14px;white-space:pre-wrap}
.chart{inline-size:100%;max-inline-size:640px;background:#fff;border:1px solid var(--border);border-radius:10px}
.kbd{font-family:Consolas,monospace;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:0 5px;font-size:12px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding-inline-start:36px;margin-block:10px}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;inline-size:24px;block-size:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
@media print{.no-print{display:none !important}}
/* v6: filters, modal, exam mode, score report */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.filters label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-block-end:3px}
.seg{display:inline-flex;border:1px solid var(--brand);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--brand);padding:6px 14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.exb{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:#eef2ff;color:#3730a3;letter-spacing:.02em}
.exb.ac{background:#fff1e3;color:#b45309}
.picklist{max-block-size:220px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--card)}
.picklist label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.modal-bg{position:fixed;inset:0;background:rgba(10,31,68,.45);display:grid;place-items:center;z-index:200}
.modal{background:#fff;border-radius:10px;max-inline-size:440px;inline-size:92vw;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
body.exam-on header.top{display:none}
body.exam-on main{max-inline-size:none;padding:0}
.xm{min-block-size:100vh;display:flex;flex-direction:column;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:15px}
.xm-top{background:#3c3c3c;color:#fff;display:flex;align-items:center;gap:16px;padding:8px 18px;font-size:14px}
.xm-top .xm-title{font-weight:700}
.xm-top .xm-right{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;line-height:1.35}
.xm-timer{font-variant-numeric:tabular-nums}
.xm-sub{background:#00838f;block-size:6px}
.xm-body{flex:1;padding:22px 30px;max-inline-size:1100px;inline-size:100%;margin-inline:auto}
.xm-foot{background:#3c3c3c;padding:10px 18px;display:flex;align-items:center;gap:12px}
.xm-foot .xm-info{color:#ddd;font-size:13px}
.xm-next{margin-inline-start:auto;background:#fff;color:#333;border:1px solid #888;border-radius:4px;padding:6px 26px;font-weight:700;cursor:pointer}
.xm-next:disabled{opacity:.5;cursor:default}
.xm-quit{background:transparent;color:#fff;border:1px solid #aaa;border-radius:4px;padding:6px 16px;font-weight:600;cursor:pointer}
.xm-quit:hover{background:rgba(255,255,255,.12)}
.xm-quit:disabled{opacity:.5;cursor:default}
.modal .row.three{flex-wrap:wrap}
.modal:has(.row.three){max-inline-size:540px}
.xm-instr{font-weight:700;margin-block-end:16px;line-height:1.5}
.xm-box{border:1px solid #bbb;border-radius:4px;padding:12px 16px;max-inline-size:440px;margin:14px auto;background:#fafafa;font-size:14px}
.xm-box .bar{margin-block:8px}
.xm-box .bar>i{background:#00838f}
.xm-box.rec .bar>i{background:#c0392b}
.xm-text{line-height:1.8;font-size:16px}
.xm-ta{inline-size:100%;min-block-size:200px;font-family:Arial,sans-serif;font-size:15px;border:1px solid #999;border-radius:2px;padding:8px}
.xm-wc{font-size:13px;color:#444;margin-block-start:4px}
.xm-screen h2{color:#00838f;margin-block:4px 14px}
.xm-screen ul{line-height:1.8}
.rep{max-inline-size:900px;margin-inline:auto}
.rep-head{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:18px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rep-ov{inline-size:120px;block-size:120px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;text-align:center;border:6px solid var(--orange)}
.rep-ov b{font-size:40px;line-height:1;display:block}
.rep-ov small{font-size:11px;font-weight:700;letter-spacing:.05em}
.sk{display:grid;grid-template-columns:160px 52px 1fr;gap:10px;align-items:center;margin-block:8px}
.sk .trk{position:relative;block-size:14px;background:#e5e7eb;border-radius:3px}
.sk .trk i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px}
.sk .trk .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;font-size:10px;color:#6b7280;transform:translateY(16px)}
.sk b{font-size:18px;text-align:end}
</style>
</head>
<body>
<header class="top no-print">
  <div class="top-in">
    <a class="logo" href="./" aria-label="PTE Decode Academy website"><img src="assets/logo.png" alt="PTE Decode Academy" style="block-size:42px;inline-size:auto"></a>
    <nav class="tabs" id="tabs"></nav>
    <span class="spacer"></span>
    <a class="btn ghost sm" href="./">← Website</a>
    <span class="who" id="who"></span>
    <button class="btn ghost sm hidden" id="logoutBtn" type="button">Sign out</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast hidden" role="status"></div>
<input type="file" id="filePick" class="hidden" accept=".json,application/json" multiple>
<script src="assets/config.js"></script>
<script>/* clean addresses: show /pte-core instead of /pte-core.html */
(function(){ var p = location.pathname; if (/\.html$/i.test(p)) { var c = p.replace(/index\.html$/i, "").replace(/\.html$/i, ""); try { history.replaceState(null, "", c + location.search + location.hash); } catch(e){} } })();
</script>
<script>
/* =====================================================================
   PTE DECODE ACADEMY PORTAL — CONFIGURATION
   Edit ONLY this block: paste your Google Apps Script Web app URL once after setup.
   ===================================================================== */
const CONFIG = {
  platformName: "PTE Decode Academy",
  tagline: "Decode PTE. Achieve Your Target.",
  teacherName: "PTE Decode Academy",
  /* The Web app URL is read from assets/config.js (shared with the website). */
  apiUrl: (window.SITE_CONFIG && window.SITE_CONFIG.apiUrl) || ""
};

/* =====================================================================
   TASK CATALOGUE — PTE Core (19 types) and PTE Academic (22 types), formats since Aug 2025.
   TASK_DEFS holds every type once; EXAM_ORDER lists each exam's types in test order and
   EXAM_OVERRIDES changes instructions, timing and word limits per exam (e.g. SWT, SST).
   ===================================================================== */
const SECTIONS = [
  {id:"speaking", name:"Speaking", part:"Part 1 · Speaking & Writing"},
  {id:"writing",  name:"Writing",  part:"Part 1 · Speaking & Writing"},
  {id:"reading",  name:"Reading",  part:"Part 2 · Reading"},
  {id:"listening",name:"Listening",part:"Part 3 · Listening"}
];
const TASK_DEFS = [
  {id:"ra",  sec:"speaking", name:"Read Aloud", ai:true, kind:"speak",
   instr:"Look at the text below. In 35 seconds, you must read this text aloud as naturally and clearly as possible. You have 40 seconds to read aloud.",
   timing:{prep:35, rec:40, showText:true}, exam:"6–7 items · 30–40 s prep · up to 40 s to speak",
   tip:"Use the preparation time to read silently and mark natural pauses at commas and full stops. Keep a steady, conversational pace — fluency and pronunciation matter more than speed. If you stumble, keep going; do not go back to correct yourself."},
  {id:"rs",  sec:"speaking", name:"Repeat Sentence", ai:true, kind:"speak",
   instr:"You will hear a sentence. Please repeat the sentence exactly as you hear it. You will hear the sentence only once.",
   timing:{prep:0, rec:15, audio:true}, exam:"10–12 items · listen once · ~15 s to answer",
   tip:"Remember the sentence as an idea, not a string of words. Start speaking immediately after the tone and copy the speaker's rhythm. If you miss a word, carry on fluently rather than stopping."},
  {id:"di",  sec:"speaking", name:"Describe Image", ai:true, kind:"speak",
   instr:"Look at the image below. In 25 seconds, please speak into the microphone and describe in detail what the image is showing. You will have 40 seconds to give your response.",
   timing:{prep:25, rec:40, showImage:true}, exam:"3–4 items · 25 s prep · 40 s to speak",
   tip:"Use a simple structure: (1) what the image shows, (2) the highest and lowest values or first and last steps, (3) one or two other details, (4) a short conclusion. Speak for most of the 40 seconds without long pauses."},

      return {text: l.slice(l.indexOf(":") + 1).trim(), opt:{pitch: pitches[n % 4], voice: voices.length > 1 ? voices[(voices.indexOf(VOICE) + n + voices.length) % voices.length] : null}}; })
    : [{text: String(text), opt:{}}];
  for (const c of chunks) for (const p of c.text.split(/(?<=[.!?])\s+(?=[A-Z])/)) { if (token && token.cancelled) return false; if (p.trim()) await speakOne(p.trim(), rate, c.opt); } // sentence chunks avoid long-utterance cut-offs

/* ---------- Chart images for Describe Image (drawn as SVG) ---------- */
function chartSVG(c){
  const pal = ["#0e7c86","#5a67d8","#ef4b5b","#f59e0b","#10b981","#8b5cf6"];
  const W = 640, H = 360, title = `<text x="${W/2}" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2430">${esc(c.title)}</text>`;
  let body = "";
  if (c.type === "bar" || c.type === "line") {
    const L=60, R=24, T=50, B=56, max = Math.ceil(Math.max(...c.values)*1.15/10)*10, n = c.values.length, cw = (W-L-R)/n;
    const y = v => T + (H-T-B) * (1 - v/max);
    for (let i=0;i<=5;i++){ const v = max*i/5; body += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6b7280">${Math.round(v)}</text>`; }
    if (c.type === "bar") c.values.forEach((v,i) => { const x = L + i*cw + cw*.18, w = cw*.64; body += `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="4" fill="${pal[i%pal.length]}"/><text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2430">${v}</text>`; });
    else { const pts = c.values.map((v,i) => [L + i*cw + cw/2, y(v)]); body += `<polyline fill="none" stroke="${pal[0]}" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>`; pts.forEach((p,i) => body += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${pal[0]}"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2430">${c.values[i]}</text>`); }
    c.labels.forEach((l,i) => body += `<text x="${L + i*cw + cw/2}" y="${H-B+20}" text-anchor="middle" font-size="12" fill="#374151">${esc(l)}</text>`);
    if (c.unit) body += `<text x="16" y="${(H)/2}" transform="rotate(-90 16 ${H/2})" text-anchor="middle" font-size="12" fill="#6b7280">${esc(c.unit)}</text>`;
  } else if (c.type === "pie") {
    const cx=220, cy=200, r=125, tot = c.values.reduce((a,b)=>a+b,0); let a0 = -Math.PI/2;
    c.values.forEach((v,i) => { const a1 = a0 + v/tot*2*Math.PI, big = a1-a0 > Math.PI ? 1 : 0;
      const p = (a) => [cx + r*Math.cos(a), cy + r*Math.sin(a)], s = p(a0), e = p(a1), m = p((a0+a1)/2);
      body += `<path d="M${cx},${cy} L${s[0]},${s[1]} A${r},${r} 0 ${big} 1 ${e[0]},${e[1]} Z" fill="${pal[i%pal.length]}" stroke="#fff" stroke-width="2"/>`;
      body += `<text x="${cx + (m[0]-cx)*.65}" y="${cy + (m[1]-cy)*.65 + 4}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${v}%</text>`; a0 = a1; });
    c.labels.forEach((l,i) => body += `<rect x="400" y="${100+i*34}" width="18" height="18" rx="3" fill="${pal[i%pal.length]}"/><text x="428" y="${114+i*34}" font-size="14" fill="#1f2430">${esc(l)} (${c.values[i]}%)</text>`);
  } else if (c.type === "process") {
    const n = c.labels.length, bw = 106, gap = (W - 20 - n*bw)/(n-1);
    c.labels.forEach((l,i) => { const x = 10 + i*(bw+gap), yb = 140;
      body += `<rect x="${x}" y="${yb}" width="${bw}" height="96" rx="10" fill="${pal[i%pal.length]}"/><text x="${x+bw/2}" y="${yb-12}" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Step ${i+1}</text>`;
      const ws = l.split(" "), lines = []; let cur = ""; ws.forEach(w => { if ((cur+" "+w).trim().length > 13) { lines.push(cur.trim()); cur = w; } else cur += " " + w; }); lines.push(cur.trim());
      lines.forEach((ln,j) => body += `<text x="${x+bw/2}" y="${yb + 48 - (lines.length-1)*9 + j*18}" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">${esc(ln)}</text>`);
      if (i < n-1) { const ax = x + bw + 3, bx = x + bw + gap - 3; body += `<line x1="${ax}" y1="${yb+48}" x2="${bx-6}" y2="${yb+48}" stroke="#374151" stroke-width="2"/><path d="M${bx-8},${yb+42} L${bx},${yb+48} L${bx-8},${yb+54} Z" fill="#374151"/>`; } });
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}"><rect width="${W}" height="${H}" fill="#ffffff"/>${title}${body}</svg>`;
}

/* =====================================================================
   SCORING (automatic estimates — your teacher gives the final feedback)
   ===================================================================== */
function lcsCount(a, b){ const m=a.length, n=b.length; const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]); return dp[m][n]; }
function kwHits(text, list){ const t = " " + String(text||"").toLowerCase().replace(/\s+/g," ") + " "; return list.map(k => new RegExp(k, "i").test(t)); }
function fluencyBand(n, secs){ if (!n || secs < 1) return 0; const wpm = n/secs*60; return wpm>=110&&wpm<=175?5 : wpm>=90&&wpm<=195?4 : wpm>=70?3 : wpm>=50?2 : 1; }
function pronBand(confs, ratio, n){ if (!n) return 0; const good = confs.filter(c=>c>0); if (good.length) { const avg = good.reduce((a,b)=>a+b,0)/good.length; return clamp(Math.round(avg*5),1,5); } return clamp(Math.round(ratio*4)+1,1,5); }
function grammarBand(text, email){ const s = String(text||"").trim(); if (!s) return 0; let g = 2;
  const body = s.replace(/\b(?:[a-z]\.){2,}/gi, m => m.replace(/\./g,"")).replace(/\b(?:mr|mrs|ms|dr|etc|e\.g|i\.e)\./gi, m => m.replace(/\./g,""));
  const lines = email ? body.split(/\n+/).filter(l => l.trim()) : [body];
  const sentences = lines.flatMap(l => l.trim().split(/(?<=[.!?])\s+/)).filter(Boolean);
  if (sentences.some(x => !/^[A-Z0-9"'(£$€]/.test(x.trim()))) g--;
  if (!email && !/[.!?]$/.test(s)) g--;
  if (/(^|\s)i(\s|'|$)/.test(s) || /[ \t]{2,}\S|[ \t][,.]/.test(s)) g--; return clamp(g,0,2); }

function scoreSpeaking(task, item, r){
  const n = words(r.transcript).length, secs = r.secs || 0;
  if (!r.recognitionAvailable) return {parts:[], total:null, max:null, note:"Automatic scoring needs Chrome or Microsoft Edge (speech recognition). Your recording is saved for your teacher to review."};
  if (!n) return {parts:[{label:"Content",got:0,max:task.id==="asq"?1:5}], total:0, max:task.id==="asq"?1:(task.id==="rs"?13:15), note:"No speech was detected. Check your microphone and speak clearly after the tone."};
  if (task.id === "asq") { const said = " " + words(r.transcript).join(" ") + " "; const ok = item.a.some(a => said.includes(" " + words(a).join(" ") + " ")); return {parts:[{label:"Vocabulary",got:ok?1:0,max:1}], total:ok?1:0, max:1, note: ok ? "Correct." : "Expected: " + item.a[0]}; }
  let content, cMax = 5, ratio;
  if (task.id === "ra" || task.id === "rs") {
    const target = words(item.text), said = words(r.transcript); ratio = lcsCount(target, said) / target.length;
    if (task.id === "rs") { cMax = 3; content = ratio >= .98 ? 3 : ratio >= .5 ? 2 : ratio > .1 ? 1 : 0; } else content = clamp(Math.round(ratio*5),0,5);
  } else {
    const hits = kwHits(r.transcript, item.keywords); ratio = hits.filter(Boolean).length / hits.length;
    const lenBonus = n >= 55 ? 1 : n >= 35 ? .5 : 0; content = clamp(Math.round(ratio*4 + lenBonus),0,5);
  }
  const flu = fluencyBand(n, secs), pro = pronBand(r.confs||[], ratio, n);
  const parts = [{label: task.id==="rts" ? "Appropriacy" : "Content", got:content, max:cMax}, {label:"Oral fluency", got:flu, max:5}, {label:"Pronunciation", got:pro, max:5}];
  return {parts, total: content+flu+pro, max: cMax+10, note: `${n} words in ${Math.round(secs)} s (${secs?Math.round(n/secs*60):0} words/min). Scores are estimates from speech recognition.`};

function vocabBand(text){ const w = words(text); if (w.length < 20) return w.length ? 1 : 0; const uniq = new Set(w.filter(x => x.length > 3)).size / Math.max(1, w.filter(x => x.length > 3).length); return uniq >= .7 ? 2 : uniq >= .5 ? 1 : 0; }

    note:`${n} words.` + (task.timing.oneSentence && !oneSentence ? " PTE Academic needs ONE sentence — you wrote " + sentences + "." : "")};
}

/* ---------- Speaking ---------- */
function buildSpeak(t, item, body){
  let html = "";
  if (t.id === "ra") html += `<div class="passage">${esc(item.text)}</div>`;
  if (t.id === "di") html += item.chart ? chartSVG(item.chart) : `${item.title?`<h3>${esc(item.title)}</h3>`:""}<div class="diwrap"><img id="diImg" class="chart" alt="${esc(item.title||"Image to describe")}" style="display:none"><p class="muted small" id="diLoad">Loading image…</p></div>`;
  if (t.id === "rts") html += `<div class="passage">${esc(item.text)}</div>`;
  if (t.id === "rs" || t.id === "asq" || t.id === "rl" || t.id === "sgd") html += `<p class="muted">🎧 The ${({rs:"sentence",asq:"question",rl:"lecture",sgd:"discussion"})[t.id]} will be played when you press Start. You will hear it once.</p>`;
  html += `<div class="rec"><div class="rec-status">Press Start when you are ready.</div><div class="bar"><i></i></div><div class="rec-live" aria-live="polite"></div>
    <div class="row" style="margin-block-start:10px"><button class="btn" type="button" id="recStart">▶ Start</button><button class="btn ghost hidden" type="button" id="recSkip">Skip waiting</button><button class="btn danger hidden" type="button" id="recStop">■ Finish</button></div></div>`;
  body.innerHTML = html;
  $("#recStart").addEventListener("click", () => runSpeaking(t, item));
  if (t.id === "di" && item.imageQid) mediaURL(item.imageQid, "image").then(u => { const im = $("#diImg"); if (im) { im.src = u; im.style.display = "block"; $("#diLoad").remove(); } }).catch(e => { const l = $("#diLoad"); if (l) l.textContent = "The image couldn't be loaded: " + e.message; });
}
async function runSpeaking(t, item){
  const status = $(".rec-status"), bar = $(".bar"), fill = $(".bar>i"), live = $(".rec-live"), startB = $("#recStart"), skipB = $("#recSkip"), stopB = $("#recStop");
  const sess = {cancelled:false, timer:null, done:null, cancel(){ this.cancelled = true; clearInterval(this.timer); try { recorder && recorder.state !== "inactive" && recorder.stop(); } catch(e){} try { recog && recog.abort(); } catch(e){} stream && stream.getTracks().forEach(x=>x.stop()); try { speechSynthesis.cancel(); } catch(e){} }};
  let stream, recorder, recog, chunks = [], transcript = "", interim = "", confs = [], recording = false;
  stopActive(); ACTIVE = sess; startB.classList.add("hidden");
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ status.textContent = "Microphone access is blocked. Allow the microphone for this site in your browser settings, then try again."; startB.classList.remove("hidden"); return; }
  const countdown = (secs, label, rec) => new Promise(res => { const t0 = Date.now(); bar.classList.toggle("recording", !!rec);
    sess.done = () => { clearInterval(sess.timer); res(); };
    const tick = () => { const el = (Date.now()-t0)/1000; status.textContent = label.replace("{s}", Math.max(0, Math.ceil(secs-el))); fill.style.inlineSize = Math.min(100, el/secs*100) + "%"; if (el >= secs) sess.done(); };
    sess.timer = setInterval(tick, 200); tick(); });
  const audioText = t.id === "rs" ? item.text : t.id === "asq" ? item.q : t.id === "rts" ? item.text : (t.id === "rl" || t.id === "sgd") ? item.script : null;
  if (audioText) { status.textContent = "🔊 Playing audio…"; fill.style.inlineSize = "0%"; await playPrompt(item, audioText, sess); if (sess.cancelled) return; if (!("speechSynthesis" in window)) live.textContent = "Audio is not supported in this browser. Prompt: " + audioText; }
  if (t.timing.prep) { skipB.classList.remove("hidden"); skipB.onclick = () => sess.done && sess.done(); await countdown(t.timing.prep, "Recording begins in {s} seconds", false); skipB.classList.add("hidden"); if (sess.cancelled) return; }
  await beep(); if (sess.cancelled) return;
  // start recording + speech recognition
  try { recorder = new MediaRecorder(stream); recorder.ondataavailable = e => e.data.size && chunks.push(e.data); recorder.start(); } catch(e){ recorder = null; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recording = true;
  if (SR) { try { recog = new SR(); recog.lang = "en-US"; recog.continuous = true; recog.interimResults = true;
      recog.onresult = e => { interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) { transcript += " " + r[0].transcript; if (r[0].confidence) confs.push(r[0].confidence); } else interim += r[0].transcript; } };
      recog.onend = () => { if (recording && !sess.cancelled) { try { recog.start(); } catch(e){} } };
      recog.onerror = () => {}; recog.start(); } catch(e){ recog = null; } }
  const recStart = Date.now(); stopB.classList.remove("hidden"); stopB.onclick = () => sess.done && sess.done();
  await countdown(t.timing.rec, "● Recording… {s} seconds left", true); if (sess.cancelled) return;
  const secs = (Date.now() - recStart)/1000; recording = false; stopB.classList.add("hidden");
  status.textContent = "Processing your answer…"; fill.style.inlineSize = "100%";
  if (recog) { try { recog.stop(); } catch(e){} await new Promise(r => setTimeout(r, 1200)); }
  if (interim && !transcript.trim()) transcript = interim; else if (interim) transcript += " " + interim;
  const blob = await new Promise(res => { if (!recorder || recorder.state === "inactive") return res(null); recorder.onstop = () => res(new Blob(chunks, {type: recorder.mimeType || "audio/webm"})); recorder.stop(); });
  stream.getTracks().forEach(x => x.stop()); ACTIVE = null;
  const auto = scoreSpeaking(t, item, {transcript: transcript.trim(), secs, confs, recognitionAvailable: !!recog});
  const att = await saveAttempt(t, {transcript: transcript.trim(), seconds: Math.round(secs), audio: blob}, auto);
  status.textContent = "✓ Response saved."; live.textContent = "";
  const url = blob ? URL.createObjectURL(blob) : null;
  const ref = t.id==="ra"||t.id==="rs" ? `<div class="model"><b>Text:</b> ${esc(item.text)}</div>` : t.id==="asq" ? `<div class="model"><b>Question:</b> ${esc(item.q)}<br><b>Answer:</b> ${esc(item.a[0])}</div>` : item.model ? `<div class="model" style="white-space:pre-wrap"><b>Sample answer:</b> ${esc(item.model)}</div>` : "";
  const scr = (t.id === "rl" || t.id === "sgd") && item.script ? `<details style="margin-block-start:8px"><summary class="small">Show transcript of the ${t.id==="rl"?"lecture":"discussion"}</summary><div class="small" style="white-space:pre-wrap">${esc(item.script)}</div></details>` : "";
  $("#qresult").innerHTML = scoreHTML(auto, `${url?`<div style="margin-block-start:10px"><audio controls src="${url}"></audio></div>`:""}${ref}${scr}${retryBtn()}`);
  bindRetry(t, att);
}

/* ---------- Writing (SWT, Write Email, SST) ---------- */
function buildWrite(t, item, body){
  let html = "";
  if (t.id === "swt") html += `<h3>${esc(item.title)}</h3><div class="passage">${esc(item.text)}</div>`;
  if (t.id === "essay") html += `<div class="passage">${esc(item.prompt)}</div>`;
  if (t.id === "we") html += `<div class="passage">${esc(item.situation)}<ul style="margin-block:8px 0">${item.points.map(p=>`<li>${esc(p.label)}</li>`).join("")}</ul></div>`;
  if (t.id === "sst") html += `<div class="row"><button class="btn" type="button" id="playA">▶ Play recording</button><span class="small muted" id="playInfo">In the exam you hear it once.</span></div>`;
  html += `<div class="row" style="justify-content:space-between;margin-block:14px 6px"><b>Your response</b><span>Time left: <span class="timer" id="wTimer">${t.timing.min}:00</span></span></div>
    <textarea id="wText" spellcheck="false" autocomplete="off" placeholder="Type your answer here…" style="min-block-size:${t.id==='we'?220:t.id==='essay'?320:140}px"></textarea>
    <div class="wc"><span id="wCount">Word count: 0</span><span>Target: ${t.timing.words[0]}–${t.timing.words[1]} words</span></div>
    <button class="btn" type="button" id="wSubmit" style="margin-block-start:10px">Submit answer</button>`;
  body.innerHTML = html;
  const ta = $("#wText"), cnt = $("#wCount"); ta.addEventListener("input", () => cnt.textContent = "Word count: " + wordCount(ta.value));
  const sess = {cancelled:false, cancel(){ this.cancelled = true; clearInterval(this.iv); try { speechSynthesis.cancel(); } catch(e){} }};
  ACTIVE = sess; let left = t.timing.min*60, started = Date.now();
  sess.iv = setInterval(() => { left--; const el = $("#wTimer"); if (!el) return clearInterval(sess.iv); el.textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0"); el.classList.toggle("low", left <= 60); if (left <= 0) { clearInterval(sess.iv); toast("Time is up — your answer has been submitted."); submit(); } }, 1000);
  if (t.id === "sst") { let plays = 0; $("#playA").addEventListener("click", async () => { plays++; $("#playA").disabled = true; $("#playInfo").textContent = "🔊 Playing…"; await playPrompt(item, item.script, sess); $("#playA").disabled = false; $("#playInfo").textContent = `Played ${plays} time${plays>1?"s":""}. In the exam you hear it once.`; }); }
  let submitted = false;
  async function submit(){ if (submitted) return; submitted = true; clearInterval(sess.iv); ta.readOnly = true; $("#wSubmit").disabled = true;
    const auto = scoreWriting(t, item, ta.value);
    const att = await saveAttempt(t, {text: ta.value, seconds: Math.round((Date.now()-started)/1000)}, auto);
    const mtext = t.id === "sst" && EXAM === "Academic" && item.modelAc ? item.modelAc : item.model;
    const model = mtext ? `<div class="model" style="white-space:pre-wrap"><b>Sample answer:</b>\n${esc(mtext)}</div>` : "";
    const scr = t.id === "sst" ? `<details style="margin-block-start:8px"><summary class="small">Show transcript</summary><div class="small">${esc(item.script)}</div></details>` : "";
    $("#qresult").innerHTML = scoreHTML(auto, model + scr + retryBtn()); bindRetry(t, att); }
  $("#wSubmit").addEventListener("click", submit);
}

function buildRWFIB(t, item, body){

  $("#chk").addEventListener("click", async () => { const sels = $$("select.blank"); let got = 0; const ans = [];
    sels.forEach(s => { const b = item.blanks[s.dataset.b], ok = s.value === b.a; ans.push(s.value); if (ok) got++; s.classList.add(ok?"right":"wrong"); s.disabled = true; });

function buildMC(t, item, body){
  const multi = t.kind === "mcm";
  body.innerHTML = (lis(t) ? audioBar() : `<div class="passage">${esc(item.text)}</div>`) + `<h3 style="margin-block:16px 8px">${esc(item.q)}</h3>` +

  if (lis(t)) bindAudio(item.script, t.id === "smw");
  $("#chk").addEventListener("click", async () => { const chosen = $$("input[name=mc]:checked").map(x => +x.value); if (!chosen.length) return toast("Select an answer first.");
    const correct = multi ? item.a : [item.a]; let total, max;
    if (multi) { total = Math.max(0, chosen.filter(c => correct.includes(c)).length - chosen.filter(c => !correct.includes(c)).length); max = correct.length; } else { total = chosen[0] === item.a ? 1 : 0; max = 1; }
    $$(".opt").forEach((l,i) => { if (correct.includes(i)) l.classList.add("right"); else if (chosen.includes(i)) l.classList.add("wrong"); l.querySelector("input").disabled = true; });

    $("#qresult").innerHTML = scoreHTML(auto, (lis(t) ? `<details style="margin-block-start:8px"><summary class="small">Show transcript</summary><div class="small">${esc(item.script)}${t.id==="smw"?" <b>"+esc(item.o[item.a])+"</b>":""}</div></details>` : "") + retryBtn()); bindRetry(t, att); });
}
/* ---------- Re-order paragraphs ---------- */
function buildRO(t, item, body){
  let order = shuffle(item.items.map((_,i)=>i), S.idx + 7); if (order.every((v,i)=>v===i)) order.reverse();
  const draw = (locked, res) => { $("#roList").innerHTML = order.map((k,pos) => `<div class="ro-item ${res?res[pos]:''}"><span class="badge b-info">${String.fromCharCode(65+k)}</span><span class="t">${esc(item.items[k])}</span>${locked?"":`<button class="btn ghost sm" type="button" data-up="${pos}" ${pos===0?"disabled":""} aria-label="Move up">↑</button><button class="btn ghost sm" type="button" data-dn="${pos}" ${pos===order.length-1?"disabled":""} aria-label="Move down">↓</button>`}</div>`).join("");
    $$("[data-up]").forEach(b => b.addEventListener("click", () => { const p = +b.dataset.up; [order[p-1],order[p]] = [order[p],order[p-1]]; draw(); }));
    $$("[data-dn]").forEach(b => b.addEventListener("click", () => { const p = +b.dataset.dn; [order[p+1],order[p]] = [order[p],order[p+1]]; draw(); })); };
  body.innerHTML = `<div id="roList"></div><button class="btn" type="button" id="chk" style="margin-block-start:10px">Submit answer</button>`; draw();
  $("#chk").addEventListener("click", async () => { let pairs = 0; for (let i=0;i<order.length-1;i++) if (order[i+1] === order[i]+1) pairs++;
    draw(true, order.map((k,pos) => k===pos ? "right" : "wrong"));
    const auto = {parts:[], total:pairs, max:order.length-1, note:"1 point for each correctly ordered adjacent pair. Correct order: " + item.items.map((_,i)=>String.fromCharCode(65+i)).join(" → ")};
    const att = await saveAttempt(t, {order: order.map(k=>String.fromCharCode(65+k))}, auto); $("#chk").disabled = true; $("#qresult").innerHTML = scoreHTML(auto, retryBtn()); bindRetry(t, att); });
}
/* ---------- Reading FIB (drag and drop) ---------- */
function buildDND(t, item, body){
  const pool = shuffle(item.a.concat(item.extra), S.idx + 3); const fill = {}; let selected = null;
  body.innerHTML = `<div class="passage" id="dndText">${esc(item.text).replace(/\[\[(\d+)\]\]/g, (_, n) => `<span class="drop" data-d="${n}" tabindex="0">&nbsp;</span>`)}</div><div class="chips" id="pool"></div><button class="btn" type="button" id="chk">Submit answer</button>`;
  const drawPool = () => { const used = Object.values(fill); $("#pool").innerHTML = pool.filter(w => !used.includes(w)).map(w => `<span class="chip ${selected===w?'sel':''}" draggable="true" data-w="${esc(w)}">${esc(w)}</span>`).join("");
    $$(".chip").forEach(c => { c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.w)); c.addEventListener("click", () => { selected = selected === c.dataset.w ? null : c.dataset.w; drawPool(); }); }); };
  const place = (d, w) => { for (const k in fill) if (fill[k] === w) delete fill[k]; fill[d.dataset.d] = w; selected = null; drawDrops(); drawPool(); };
  const drawDrops = () => $$(".drop").forEach(d => { const w = fill[d.dataset.d]; d.textContent = w || "\u00a0"; d.classList.toggle("filled", !!w); });
  $$(".drop").forEach(d => { d.addEventListener("dragover", e => e.preventDefault()); d.addEventListener("drop", e => { e.preventDefault(); place(d, e.dataTransfer.getData("text/plain")); });
    d.addEventListener("click", () => { if (d.dataset.locked) return; if (selected) place(d, selected); else if (fill[d.dataset.d]) { delete fill[d.dataset.d]; drawDrops(); drawPool(); } }); });
  drawPool();
  $("#chk").addEventListener("click", async () => { let got = 0; $$(".drop").forEach(d => { const ok = fill[d.dataset.d] === item.a[d.dataset.d]; if (ok) got++; d.classList.add(ok?"right":"wrong"); d.dataset.locked = "1"; });
    const auto = {parts:[], total:got, max:item.a.length, note:"1 point per correct gap. Answers: " + item.a.join(", ")};
    const att = await saveAttempt(t, {selections: item.a.map((_,i)=>fill[i]||"")}, auto); $("#chk").disabled = true; $("#pool").innerHTML = ""; $("#qresult").innerHTML = scoreHTML(auto, retryBtn()); bindRetry(t, att); });
}
/* ---------- Listening FIB ---------- */
function buildLFIB(t, item, body){

/* ---------- Highlight incorrect words ---------- */
function buildHIW(t, item, body){
  const shown = item.shown.split(/\s+/), spoken = item.spoken.split(/\s+/), clean = w => w.toLowerCase().replace(/[^a-z0-9']/g,"");

  $("#chk").addEventListener("click", async () => { const good = [...sel].filter(i => wrongIdx.includes(i)).length, bad = sel.size - good;

    const auto = {parts:[], total: Math.max(0, good-bad), max: wrongIdx.length, note:"+1 for each correct word, −1 for each wrong click. The speaker said: " + wrongIdx.map(i => `"${spoken[i]}" (not "${shown[i]}")`).join(", ")};

function buildWFD(t, item, body){

function describeResponse(a){
  const r = a.response || {};
  if (r.text !== undefined) return r.text || "—";
  if (r.transcript !== undefined) return "🎙 Voice recording";
  if (r.order) return "Order: " + r.order.join(" → ");
  if (r.selections) { const it = getItem(a.type, a.itemIdx); if (it && it.o && (a.type==="rmcm"||a.type==="lmcm"||a.type==="rmcs"||a.type==="lmcs"||a.type==="smw")) return "Chose: " + r.selections.map(i => it.o[i]).join(" | "); return "Answers: " + r.selections.map(x => x===""?"(blank)":x).join(", "); }

}

/* =====================================================================
   TEACHER-UPLOADED QUESTIONS
   Built-in questions keep their positions (0, 1, 2 …). Teacher questions use
   1000 + their number, so adding or hiding questions never changes the
   question numbers on work students have already submitted.
   ===================================================================== */
const CUSTOM_BASE = 999;
let CUSTOM = {}, SHOW_BUILTIN = true, QLOADED = false;
const MEDIA = {};

const isCustom = idx => idx > CUSTOM_BASE;
const qExamOk = (qexam, exam) => !qexam || qexam === "Both" || qexam === exam;
/* Exclusive types are fixed to their exam; shared types can target Core, Academic or Both. */
const typeExams = id => EXAMS.filter(e => EXAM_ORDER[e].includes(id));
function getItem(type, idx){ if (isCustom(idx)) { const c = (CUSTOM[type]||{})[idx]; return c ? c.item : null; } return (BANK[type]||[])[idx] || null; }
function qLabel(type, idx){ return isCustom(idx) ? `★ Teacher Q${idx - CUSTOM_BASE}` : `Practice Q${idx + 1}`; }
function visibleList(type){
  const out = [];
  Object.keys(CUSTOM[type]||{}).map(Number).sort((a,b)=>a-b).forEach(idx => { const c = CUSTOM[type][idx]; if (c.status === "Active" && qExamOk(c.exam, EXAM)) out.push({idx, item:c.item, custom:true}); });
  if (SHOW_BUILTIN) (BANK[type]||[]).forEach((item, i) => out.push({idx:i, item, custom:false}));
  return out;
}
function applyQuestions(list, showBuiltin){
  CUSTOM = {}; SHOW_BUILTIN = showBuiltin !== false;
  (list||[]).forEach(q => { const f = QFORMS[q.type]; if (!f) return;
    let item; try { item = f.toItem(q.data || {}, q); } catch(e){ return; }
    item.qid = q.id; if (q.hasAudio) item.audioQid = q.id; if (q.hasImage) item.imageQid = q.id;
    (CUSTOM[q.type] = CUSTOM[q.type] || {})[CUSTOM_BASE + q.no] = {item, status:q.status, no:q.no, id:q.id, data:q.data||{}, hasAudio:q.hasAudio, hasImage:q.hasImage, updated:q.updated, exam:q.exam || "Both"}; });
  QLOADED = true;
}
async function ensureQuestions(force){
  if (QLOADED && !force) return;
  try { const r = S.mode === "teacher" ? await tapi("t_questions") : await api("questions", {code:S.session.code}); applyQuestions(r.items, r.showBuiltin); }
  catch(e){ if (!QLOADED) applyQuestions([], true); }
}
async function mediaURL(qid, kind){
  const k = qid + ":" + kind; if (MEDIA[k]) return MEDIA[k];
  const r = S.mode === "teacher" ? await tapi("qMedia", {id:qid, kind}) : await api("qMedia", {code:S.session.code, id:qid, kind});
  return (MEDIA[k] = r.data);
}
/* Plays the teacher's own recording when there is one, otherwise the computer voice. */
async function playPrompt(item, text, token){
  if (item && item.audioQid) {
    try { const url = await mediaURL(item.audioQid, "audio"); if (token && token.cancelled) return false;
      return await new Promise(res => { const a = new Audio(url); a.onended = () => res(true); a.onerror = () => res(false);
        if (token) { const old = token.cancel; token.cancel = function(){ try { a.pause(); } catch(e){} res(false); return old.apply(this, arguments); }; }
        a.play().catch(() => res(false)); }); }
    catch(e){ toast("Couldn't load the recording, so the computer voice is used instead."); }
  }
  return speak(text, token);
}

/* ---------- helpers that turn teacher input into scorable questions ---------- */
const STOP = new Set("about above after again against because been before being below between both could does doing down during each further have having here into itself just more most other ought over same should some such than that their theirs them then there these they this those through under until very were what when where which while whom with would your yours also many much will shall from only well like make made take".split(" "));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function stem(w){ return w.length > 7 ? w.slice(0, 6) : w; }
function contentWords(text, n){ const seen = new Set(), out = [];
  (String(text||"").toLowerCase().match(/[a-z][a-z'-]{3,}/g) || []).forEach(w => { if (STOP.has(w)) return; const s = stem(w); if (!seen.has(s)) { seen.add(s); out.push(s); } });
  return n ? out.sort((a,b) => b.length - a.length).slice(0, n) : out; }
/* "four-day / shorter week, productivity" → ["four\-day|shorter week","productivity"] */
function keywordList(manual, fallbackText, generic){
  const m = String(manual||"").split(/[,\n]+/).map(x => x.trim()).filter(Boolean);
  if (m.length) return m.map(k => k.split("/").map(x => reEsc(x.trim().toLowerCase())).filter(Boolean).join("|"));
  const auto = contentWords(fallbackText, 8).map(reEsc);
  return auto.length >= 3 ? auto : generic;
}
function splitLines(v){ return String(v||"").split(/\r?\n|\s\|\s/).map(x => x.trim()).filter(Boolean); }
function parseOptions(v, need){ const lines = splitLines(v); if (lines.length < 2) throw new Error("Add at least 2 answer options, one per line.");
  const o = [], a = []; lines.forEach((l, i) => { if (l.startsWith("*")) { a.push(i); o.push(l.replace(/^\*+\s*/, "")); } else o.push(l); });
  if (!a.length) throw new Error("Mark the correct option(s) with * at the start of the line.");
  if (need === "single" && a.length !== 1) throw new Error("Mark exactly one correct option with *.");
  if (need === "multi" && a.length < 1) throw new Error("Mark the correct options with *.");
  return {o, a}; }
function seedOf(s){ let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 100000; return h || 1; }

/* ---------- CSV (Excel) import / export ---------- */
function parseCSV(text){
  text = String(text).replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || ""; const delim = [";", "\t", ","].sort((x,y) => first.split(y).length - first.split(x).length)[0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c; }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}

function compressImage(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = () => rej(new Error("Couldn't read the image."));
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("That file isn't a supported image. Use JPG or PNG."));
      img.onload = () => { const max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85)); };
      img.src = fr.result; };
    fr.readAsDataURL(file); });
}

/* Voice recorder used for teacher voice feedback */
function makeRecorder(host, onChange, label){
  label = label || "🎙 Record voice feedback";
  let rec = null, chunks = [], stream = null, timer = null, blob = null, t0 = 0; const MAX = 180;
  host.innerHTML = `<div class="row vr"><button class="btn ghost sm vrStart" type="button">${label}</button><span class="small vrInfo muted"></span></div>`;
  const start = host.querySelector(".vrStart"), info = host.querySelector(".vrInfo");
  const stopAll = () => { clearInterval(timer); try { rec && rec.state !== "inactive" && rec.stop(); } catch(e){} };
  const reset = () => { blob = null; onChange(null); const pv = host.querySelector(".vrPrev"); if (pv) pv.remove(); start.textContent = label; start.classList.remove("danger"); info.textContent = ""; };
  start.addEventListener("click", async () => {
    if (rec && rec.state === "recording") { stopAll(); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
    catch(e){ toast("Microphone access is blocked. Click the padlock in the address bar and allow the microphone."); return; }
    reset(); chunks = []; rec = new MediaRecorder(stream); rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(x => x.stop()); blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"}); onChange(blob);
      start.textContent = "🎙 Record again"; start.classList.remove("danger"); info.textContent = `Recording ready (${Math.round((Date.now()-t0)/1000)} s) — it will be saved when you click Send/Save.`;
      const wrap = document.createElement("div"); wrap.className = "row vrPrev"; wrap.style.marginBlockStart = "6px";
      wrap.innerHTML = `<audio controls></audio><button class="btn ghost sm" type="button">✕ Discard</button>`; wrap.querySelector("audio").src = URL.createObjectURL(blob);
      wrap.querySelector("button").addEventListener("click", reset); host.appendChild(wrap); };
    rec.start(); t0 = Date.now(); start.textContent = "■ Stop recording"; start.classList.add("danger");
    timer = setInterval(() => { const s = Math.round((Date.now()-t0)/1000); info.textContent = `● Recording… ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} (max 3:00)`; if (s >= MAX) stopAll(); }, 250);
  });
  return { cancel: stopAll };
}

function reviewCard(x, recs){

  const reviewed = x.status === "Reviewed";
  card.innerHTML = `<div class="row"><b>${esc(x.taskName)}</b>${examBadge(x.exam)}<span class="small muted">${esc(x.section||"")} · ${esc(qLabel(x.type, x.itemIdx))}</span><span class="spacer"></span><span class="small"><b>${esc(x.studentName)}</b> · ${esc(fmtDate(x.submittedAt))}</span><span class="badge ${reviewed?"b-ok":"b-warn"} stBadge">${reviewed?"Reviewed":"Waiting"}</span></div>

    ${x.hasAudio ? `<div style="margin-block:6px"><button class="btn ghost sm aBtn" type="button">▶ Play recording</button></div>` : ""}
    <div class="resp">${esc(respText(x.response)||"—")}</div>${key}
    <div class="small" style="margin-block-start:6px">Auto-score: <b>${x.autoMax?`${esc(x.autoTotal)} / ${esc(x.autoMax)}`:"not available"}</b> ${parts.length?"("+parts.map(q=>esc(q.label)+" "+esc(q.got)+"/"+esc(q.max)).join(", ")+")":""}</div>
    <div class="row" style="margin-block-start:10px;align-items:flex-start"><div style="inline-size:150px"><label class="f">Your score${x.autoMax?" (out of "+esc(x.autoMax)+")":""}</label><input type="text" class="rScore" value="${esc(x.teacherScore||"")}" placeholder="${x.autoMax?"e.g. "+esc(x.autoMax):"e.g. 8/10"}"></div>
      <div style="flex:1;min-inline-size:240px"><label class="f">Feedback for the student</label><textarea class="rCom" style="min-block-size:80px" placeholder="What went well, what to improve, one specific tip…">${esc(x.teacherFeedback||"")}</textarea></div></div>
    <div class="vrHost" style="margin-block-start:8px"></div>
    <div class="fbVoice small" style="margin-block-start:6px">${x.hasFeedbackAudio?`Your voice message: <button class="btn ghost sm fvPlay" type="button">▶ Play</button> <button class="btn ghost sm fvDel" type="button">Remove</button>`:""}</div>
    <div class="row" style="margin-block-start:8px"><button class="btn sm rSave" type="button">${reviewed?"Update feedback":"Send feedback"}</button>
      <span class="waSlot">${reviewed && x.studentPhone ? waBtn("data-wan", x.id, "Tell student on WhatsApp") : ""}</span><span class="small muted rInfo">${reviewed?"Sent "+esc(fmtDate(x.reviewedAt))+(x.reviewedBy?" · Reviewed by "+esc(x.reviewedBy):""):""}</span></div>`;
  const ab = card.querySelector(".aBtn"); if (ab) ab.addEventListener("click", async () => { ab.disabled = true; ab.textContent = "Loading…";
    try { const r = await tapi("t_audio", {id:x.id}); const au = document.createElement("audio"); au.controls = true; au.src = r.audio; ab.replaceWith(au); au.play().catch(()=>{}); } catch(e){ toast(e.message); ab.disabled = false; ab.textContent = "▶ Play recording"; } });
  let voice = null, removeVoice = false; recs.push(makeRecorder(card.querySelector(".vrHost"), b => voice = b));
  const bindVoice = () => { const pl = card.querySelector(".fvPlay"), dl = card.querySelector(".fvDel");
    if (pl) pl.addEventListener("click", async () => { pl.disabled = true; pl.textContent = "Loading…"; try { const r = await tapi("t_audio", {id:x.id, kind:"feedback"}); const au = document.createElement("audio"); au.controls = true; au.src = r.audio; pl.replaceWith(au); au.play().catch(()=>{}); } catch(e){ toast(e.message); pl.disabled = false; pl.textContent = "▶ Play"; } });
    if (dl) dl.addEventListener("click", () => { removeVoice = true; card.querySelector(".fbVoice").innerHTML = '<span class="muted">The voice message will be removed when you click Update feedback.</span>'; }); };
  bindVoice();
  const bindWa = () => { const w = card.querySelector("[data-wan]"); if (w) w.addEventListener("click", () => waOpen(x.studentPhone, feedbackWaText(x))); }; bindWa();
  card.querySelector(".rSave").addEventListener("click", async e => { const b = e.target; const was = x.status === "Reviewed"; b.disabled = true; b.textContent = voice ? "Uploading voice…" : "Sending…";
    try { const audio = voice ? await blobToDataURL(voice) : null;
      const r = await tapi("t_feedback", {id:x.id, score:card.querySelector(".rScore").value.trim(), comment:card.querySelector(".rCom").value.trim(), audio, removeAudio: removeVoice && !voice});
      x.status = "Reviewed"; x.reviewedAt = r.reviewedAt; x.reviewedBy = r.reviewedBy; x.hasFeedbackAudio = r.hasFeedbackAudio; voice = null; removeVoice = false;
      recs.push(makeRecorder(card.querySelector(".vrHost"), bb => voice = bb));

    catch(err){ toast(err.message, 5000); b.disabled = false; b.textContent = was ? "Update feedback" : "Send feedback"; } });
  return card;
}

const SF = {q:"", exam:"", status:"", teacher:"", activity:"", from:"", to:""};
const DAY = 864e5;
const isoDay = d => new Date(d).toISOString().slice(0,10);
function studentStatus(c){ if (c.status !== "Active") return c.status; const e = c.expires ? new Date(c.expires + "T23:59:59") : null; return e && e - Date.now() <= 7*DAY ? "Expiring" : "Active"; }
function studentMatches(c, f){
  const terms = String(f.q||"").toLowerCase().split(/\s+/).filter(Boolean), digits = s => String(s||"").replace(/\D/g,"");
  const hay = [c.name, c.code, c.email, c.phone, c.id, c.teacherName].join(" ").toLowerCase();
  if (terms.length && !terms.every(t => hay.includes(t) || (digits(t).length >= 3 && digits(c.phone).includes(digits(t))))) return false;
  if (f.exam && c.exam !== f.exam) return false;
  if (f.status) { const st = studentStatus(c); if (f.status === "Active" ? c.status !== "Active" : f.status === "Expiring" ? st !== "Expiring" : c.status !== f.status) return false; }
  if (f.teacher && (f.teacher === "none" ? !!c.teacherId : c.teacherId !== f.teacher)) return false;
  const now = Date.now(), lastSub = [c.lastSubmission, c.lastMock].filter(Boolean).sort().pop() || "", used = !!(c.lastLogin || c.submissions || c.lastMock);
  if (f.activity === "recent" && !(lastSub && now - Date.parse(lastSub) <= 7*DAY)) return false;
  if (f.activity === "idle" && !(used && (!c.lastActivity || now - Date.parse(c.lastActivity) > 7*DAY))) return false;
  if (f.activity === "never" && used) return false;
  if (f.from && (!c.expires || c.expires < f.from)) return false;
  if (f.to && (!c.expires || c.expires > f.to)) return false;
  return true;
}

/* =====================================================================
   MOCK EXAMS — shared definitions
   4 mock tests per exam. The server draws the items at random when a student starts
   and stores the draw with the attempt, so a refresh resumes with the same questions.
   ===================================================================== */
const PART_NAMES = {1:"Part 1: Speaking and Writing", 2:"Part 2: Reading", 3:"Part 3: Listening"};
const GROUP_MIN = {R:{Core:30, Academic:30}, L:{Core:25, Academic:30}};
const groupOf = d => d.p === 2 ? "R" : (d.p === 3 && d.t !== "sst") ? "L" : null;
const PI_TASK = {id:"pi", sec:"speaking", name:"Personal Introduction", ai:false, kind:"speak", timing:{prep:25, rec:30},
  instr:"Read the prompt below. In 25 seconds, you must reply in your own words, as naturally and clearly as possible. You have 30 seconds to record your response. Your response is not scored; it is sent to your teacher with your test."};
const PI_ITEM = {text:"Please introduce yourself. For example, you could talk about one of the following:\n• Your interests\n• Your plans for future study\n• Why you want to study abroad\n• Why you need to learn English\n• Why you chose this test"};
const mxTask = (type, exam) => type === "pi" ? PI_TASK : (examTasks(exam).find(t => t.id === type) || TASK_ANY[type]);
const MOCK_SKILLS = {listening:["rs","rl","sgd","asq","sst","lmcm","lfib","hcs","lmcs","smw","hiw","wfd"], reading:["ra","rwfib","rmcm","ro","rfib","rmcs","hiw"],
  speaking:["ra","rs","di","rl","asq","sgd","rts"], writing:["swt","essay","we","sst","rwfib","wfd"]};
const ENABLING = [["grammar","Grammar"],["fluency","Oral Fluency"],["pronunciation","Pronunciation"],["spelling","Spelling"],["vocabulary","Vocabulary"],["discourse","Written Discourse"]];
const MOCK_TITLE = id => `PTE ${id.startsWith("AC") ? "Academic" : "Core"} Mock Test ${id.slice(2)}`;
function builtinCounts(exam){ const o = {}; EXAM_ORDER[exam].forEach(t => o[t] = (BANK[t]||[]).length); return o; }
function mockItem(d, qdata){
  if (d.t === "pi") return PI_ITEM;
  const ref = String(d.ref || "");
  if (ref.startsWith("b:")) return (BANK[d.t] || [])[+ref.slice(2)] || null;
  if (ref.startsWith("q:")) { const id = ref.slice(2), q = (qdata || {})[id];
    if (q && QFORMS[d.t]) { try { const it = QFORMS[d.t].toItem(q.data || {}, q); it.qid = id; if (q.hasAudio) it.audioQid = id; if (q.hasImage) it.imageQid = id; return it; } catch(e){} }
    for (const c of Object.values(CUSTOM[d.t] || {})) if (c.id === id) return c.item; }
  return null;
}
/* Pure scoring for objective items (used in mock tests; nothing is shown to the student). */
function objScore(t, item, sel){
  const k = t.kind; sel = sel || [];
  if (k === "rwfib") { const got = item.blanks.filter((b, n) => sel[n] === b.a).length; return {parts:[], total:got, max:item.blanks.length}; }
  if (k === "dnd") { const got = item.a.filter((w, n) => sel[n] === w).length; return {parts:[], total:got, max:item.a.length}; }
  if (k === "lfib") { const ans = (item.script.match(/\[([^\]]+)\]/g) || []).map(x => x.slice(1, -1)); const got = ans.filter((w, n) => String(sel[n]||"").trim().toLowerCase() === w.toLowerCase()).length; return {parts:[], total:got, max:ans.length}; }
  if (k === "mcm") { const c = item.a; return {parts:[], total:Math.max(0, sel.filter(x => c.includes(x)).length - sel.filter(x => !c.includes(x)).length), max:c.length}; }
  if (k === "mcs") return {parts:[], total: sel[0] === item.a ? 1 : 0, max:1};
  if (k === "ro") { let pairs = 0; for (let i = 0; i < sel.length - 1; i++) if (sel[i+1] === sel[i] + 1) pairs++; return {parts:[], total:pairs, max:item.items.length - 1}; }
  if (k === "hiw") { const sh = item.shown.split(/\s+/), sp = item.spoken.split(/\s+/), cl = w => w.toLowerCase().replace(/[^a-z0-9']/g,""); const wrong = sh.map((w,i) => cl(w) !== cl(sp[i]||"") ? i : -1).filter(i => i >= 0);
    const good = sel.filter(i => wrong.includes(i)).length; return {parts:[], total:Math.max(0, good - (sel.length - good)), max:wrong.length}; }
  if (k === "wfd") { const target = words(item.text), pool = words(sel); let got = 0; target.forEach(w => { const j = pool.indexOf(w); if (j >= 0) { got++; pool.splice(j, 1); } }); return {parts:[], total:got, max:target.length}; }
  return null;
}
const audioTextOf = (type, item) => ({rs:item.text, asq:item.q, rts:item.text, rl:item.script, sgd:item.script, sst:item.script, wfd:item.text, hiw:item.spoken, lfib: item.script && item.script.replace(/\[([^\]]+)\]/g, "$1")})[type] || item.script || null;

/* Prompt / response rendering shared by the teacher review and the student report */
function mxPromptHTML(type, item){
  if (!item) return `<div class="small" style="color:var(--bad)">This question is no longer available.</div>`;
  const det = (label, txt) => `<details class="small" style="margin-block:4px"><summary>${label}</summary><div style="white-space:pre-wrap">${esc(txt)}</div></details>`;
  if (type === "pi" || type === "ra" || type === "rts") return `<div class="small" style="white-space:pre-wrap">${esc(item.text)}</div>`;
  if (type === "rs" || type === "wfd") return `<div class="small"><b>Sentence:</b> ${esc(item.text)}</div>`;
  if (type === "asq") return `<div class="small"><b>Question:</b> ${esc(item.q)} · <b>Expected:</b> ${esc((item.a||[])[0]||"")}</div>`;
  if (type === "di") return item.chart ? `<details class="small"><summary>Image: ${esc(item.chart.title)}</summary>${chartSVG(item.chart)}</details>` : `<div class="small">Image: ${esc(item.title || "teacher image")}</div>`;
  if (type === "essay") return `<div class="small"><b>Topic:</b> ${esc(item.prompt)}</div>`;
  if (type === "we") return `<div class="small">${esc(item.situation)} <i>(${item.points.map(p => esc(p.label)).join(" · ")})</i></div>`;
  if (type === "swt") return det("Passage: " + esc(item.title || ""), item.text);
  if (["rl","sgd","sst"].includes(type)) return det("Audio script", item.script) + (item.model ? det("Sample answer", item.modelAc && type === "sst" ? item.modelAc : item.model) : "");
  if (type === "hiw") return det("What the speaker said", item.spoken);
  if (item.q) return `<div class="small"><b>${esc(item.q)}</b></div>` + (item.text ? det("Passage", item.text) : item.script ? det("Audio script", item.script) : "");
  if (item.text) return det("Passage", item.text.replace(/\[\[(\d+)\]\]/g, "____"));
  if (item.items) return "";
  if (item.script) return det("Audio script", item.script.replace(/\[([^\]]+)\]/g, "____"));
  return "";
}
function mxResponseHTML(type, item, ans, exam, withKey){
  const r = ans ? ans.response : null;
  if (!ans || r === null || r === undefined) return `<div class="resp muted">No answer${ans ? " (time ran out or skipped)" : ""}.</div>`;
  const t = mxTask(type, exam);
  if (t.kind === "speak") return "";
  if (t.kind === "write") { const txt = r.text || ""; return `<div class="resp">${esc(txt) || '<span class="muted">(empty)</span>'}</div><div class="small muted">${wordCount(txt)} words</div>`; }
  const sel = r.sel; if (!item) return `<div class="resp">${esc(JSON.stringify(sel))}</div>`;
  const mark = ok => ok ? '<span style="color:var(--ok);font-weight:700">✓</span>' : '<span style="color:var(--bad);font-weight:700">✗</span>';
  if (t.kind === "mcm" || t.kind === "mcs") { const key = t.kind === "mcm" ? item.a : [item.a], s = sel || [];
    return `<div class="small">${item.o.map((o, i) => `<div style="padding:2px 0">${s.includes(i) ? "● <b>" : "○ "}${esc(o)}${s.includes(i) ? "</b>" : ""}${withKey && key.includes(i) ? ' <span class="badge b-ok">correct</span>' : ""}${withKey && s.includes(i) && !key.includes(i) ? ' <span class="badge b-bad">wrong</span>' : ""}</div>`).join("")}</div>`; }
  if (t.kind === "rwfib" || t.kind === "dnd" || t.kind === "lfib") { const key = t.kind === "rwfib" ? item.blanks.map(b => b.a) : t.kind === "dnd" ? item.a : (item.script.match(/\[([^\]]+)\]/g) || []).map(x => x.slice(1, -1));
    return `<table class="t small" style="max-inline-size:520px"><thead><tr><th>Gap</th><th>Answer</th>${withKey?"<th>Correct</th><th></th>":""}</tr></thead><tbody>${key.map((k, n) => `<tr><td>${n+1}</td><td>${esc((sel||[])[n] || "—")}</td>${withKey?`<td>${esc(k)}</td><td>${mark(String((sel||[])[n]||"").trim().toLowerCase() === k.toLowerCase())}</td>`:""}</tr>`).join("")}</tbody></table>`; }
  if (t.kind === "ro") return `<div class="small"><b>Order given:</b> ${(sel||[]).map(k => String.fromCharCode(65 + k)).join(" → ")}${withKey ? ` · <b>Correct:</b> ${item.items.map((_, i) => String.fromCharCode(65 + i)).join(" → ")}` : ""}</div>
    ${withKey ? `<ol class="small" type="A" style="margin:4px 0">${item.items.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}`;
  if (t.kind === "hiw") { const sh = item.shown.split(/\s+/), sp = item.spoken.split(/\s+/), cl = w => w.toLowerCase().replace(/[^a-z0-9']/g,""); const wrong = sh.map((w,i) => cl(w) !== cl(sp[i]||"") ? i : -1).filter(i => i >= 0);
    return `<div class="small"><b>Clicked:</b> ${(sel||[]).map(i => esc(sh[i])).join(", ") || "—"}${withKey ? ` · <b>Incorrect words:</b> ${wrong.map(i => `${esc(sh[i])} (said “${esc(sp[i])}”)`).join(", ")}` : ""}</div>`; }
  if (t.kind === "wfd") return `<div class="resp">${esc(sel || "")}</div>${withKey ? `<div class="small"><b>Sentence:</b> ${esc(item.text)}</div>` : ""}`;
  return `<div class="resp">${esc(JSON.stringify(sel))}</div>`;
}
const autoLine = ans => ans && ans.autoMax ? `<div class="small">Auto-estimate: <b>${esc(ans.autoTotal)} / ${esc(ans.autoMax)}</b>${(ans.autoDetail||[]).length ? " (" + ans.autoDetail.map(q => esc(q.label) + " " + esc(q.got) + "/" + esc(q.max)).join(", ") + ")" : ""}</div>` : `<div class="small muted">${ans && ans.response && ans.response.kind === "speak" && ans.type !== "pi" ? "Auto-estimate not available (speech recognition unavailable) — please score by listening." : ans && ans.type === "pi" ? "Unscored." : ""}</div>`;
function suggestScores(answers){
  const by = {}; answers.forEach(a => { if (a.autoMax) by[a.type] = (by[a.type] || []).concat(a.autoTotal / a.autoMax); });
  const out = {}; Object.entries(MOCK_SKILLS).forEach(([sk, types]) => { const v = types.flatMap(t => by[t] || []); if (v.length) out[sk] = clamp(Math.round(10 + 80 * v.reduce((x, y) => x + y, 0) / v.length), 10, 90); });
  const vals = Object.values(out); if (vals.length) out.overall = Math.round(vals.reduce((x, y) => x + y, 0) / vals.length);
  return out;
}

    card.querySelectorAll(`input[name="aud-${id}"]`).forEach(r => r.addEventListener("change", () => { if (r.checked && r.value === "selected" && card.querySelector(".mPick input:checked")) act.checked = true; }));

      const picked = card.querySelectorAll(".mPick input:checked").length, audSel = main ? card.querySelector(`input[name="aud-${id}"]:checked`).value === "selected" : true;

        if (go2) act.checked = true; }
      if (act.checked && audSel && !picked) { toast("Tick at least one student, or choose “All students”.", 5000); return; }
      b.disabled = true;
      const payload = {mockId:id, active:act.checked, students:[...card.querySelectorAll(".mPick input:checked")].map(i => i.value)};
      if (main) Object.assign(payload, {audience: card.querySelector(`input[name="aud-${id}"]:checked`).value, opens: card.querySelector(".mOpen").value, closes: card.querySelector(".mClose").value});
      try { await tapi("t_mockSet", payload);

        renderMocksAdmin(p); } catch(err){ toast(err.message, 6000); b.disabled = false; } }); });
}

  app.innerHTML = `<div class="hero"><div><h1>Mock Exam</h1><div class="muted">Full ${esc(examLabel(EXAM))} mock tests that look and work like the real test (about 2 hours, no breaks). Your teacher activates each test for you and then sends you a full score report.</div></div>

  const B = {"Locked":["b-bad","🔒 Locked"], "Available":["b-ok","Available"], "In progress":["b-info","In progress"], "Submitted":["b-warn","Submitted – awaiting review"], "Reviewed":["b-ok","Reviewed"]};
  box.innerHTML = r.mocks.map(m => `<div class="card" data-mk="${m.id}"><div class="row"><h3 style="margin:0">${esc(m.title)}</h3><span class="spacer"></span><span class="badge ${B[m.status][0]} mkStatus">${B[m.status][1]}</span></div>

      : `<button class="btn" type="button" data-report="${esc(m.attemptId)}">View score report</button>`}</div>`).join("");
